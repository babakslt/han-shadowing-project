- category: "HSK2 - L1,2"
  phrases:
    - chinese: "我要去北京旅游。"
      pinyin: "wǒ yào qù běi jīng lǚ yóu 。"
      meaning: "I want to travel to Beijing."
    - chinese: "九月去北京最好，天气不冷也不热。"
      pinyin: "jiǔ yuè qù běi jīng zuì hǎo ， tiān qì bù lěng yě bù rè 。"
      meaning: "September is the best time to go to Beijing; the weather is neither cold nor hot."
    - chinese: "你最喜欢什么运动？"
      pinyin: "nǐ zuì xǐ huān shén me yùn dòng ？"
      meaning: "What sport do you like most?"
    - chinese: "我最喜欢踢足球。"
      pinyin: "wǒ zuì xǐ huān tī zú qiú 。"
      meaning: "I like playing soccer most."
    - chinese: "下午我们一起去踢足球吧。"
      pinyin: "xià wǔ wǒ men yī qǐ qù tī zú qiú ba 。"
      meaning: "Let's play soccer together this afternoon."
    - chinese: "我们要不要买几个新椅子？"
      pinyin: "wǒ men yào bù yào mǎi jǐ gè xīn yǐ zi ？"
      meaning: "Should we buy a few new chairs?"
    - chinese: "桌子下面有只猫。"
      pinyin: "zhuō zi xià miàn yǒu zhī māo 。"
      meaning: "There is a cat under the table."
    - chinese: "它的眼睛最漂亮。"
      pinyin: "tā de yǎn jīng zuì piào liàng 。"
      meaning: "Its eyes are the most beautiful."
    - chinese: "它六个多月大了。"
      pinyin: "tā liù gè duō yuè dà le 。"
      meaning: "It is more than six months old."
    - chinese: "你觉得什么时候去旅游最好？"
      pinyin: "nǐ jué de shén me shí hòu qù lǚ yóu zuì hǎo ？"
      meaning: "When do you think is the best time to travel?"
    - chinese: "你每天几点起床？"
      pinyin: "nǐ měi tiān jǐ diǎn qǐ chuáng ？"
      meaning: "What time do you get up every day?"
    - chinese: "我每天六点起床。"
      pinyin: "wǒ měi tiān liù diǎn qǐ chuáng 。"
      meaning: "I get up at six o'clock every day."
    - chinese: "你很少生病，是不是喜欢运动？"
      pinyin: "nǐ hěn shǎo shēng bìng ， shì bú shì xǐ huān yùn dòng ？"
      meaning: "You rarely get sick—do you like sports?"
    - chinese: "我每天早上都要出去跑步。"
      pinyin: "wǒ měi tiān zǎo shàng dōu yào chū qù pǎo bù 。"
      meaning: "I go out running every morning."
    - chinese: "你多大了？"
      pinyin: "nǐ duō dà le ？"
      meaning: "How old are you?"
    - chinese: "大卫二十多岁。"
      pinyin: "dà wèi èr shí duō suì 。"
      meaning: "David is in his twenties."
    - chinese: "他多高？"
      pinyin: "tā duō gāo ？"
      meaning: "How tall is he?"
    - chinese: "他一米八几。"
      pinyin: "tā yī mǐ bā jǐ 。"
      meaning: "He is about 180-something centimeters tall."
    - chinese: "张老师这几天很忙，没有时间休息。"
      pinyin: "zhāng lǎo shī zhè jǐ tiān hěn máng ， méi yǒu shí jiān xiū xi 。"
      meaning: "Teacher Zhang has been very busy these days and has no time to rest."
    - chinese: "你每个星期六都工作吗？"
      pinyin: "nǐ měi gè xīng qī liù dōu gōng zuò ma ？"
      meaning: "Do you work every Saturday?"
