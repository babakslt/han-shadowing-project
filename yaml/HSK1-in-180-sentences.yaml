- category: "HSK1 - Lesson 1"
  phrases:
    - chinese: "你好！"
      pinyin: "Nǐ hǎo!"
      meaning: "Hello!"
    - chinese: "您好！"
      pinyin: "Nín hǎo!"
      meaning: "Hello (respectful)!"
    - chinese: "你们好！"
      pinyin: "Nǐmen hǎo!"
      meaning: "Hello everyone!"
    - chinese: "对不起。"
      pinyin: "Duìbuqǐ."
      meaning: "I'm sorry."
    - chinese: "没关系。"
      pinyin: "Méi guānxi."
      meaning: "It doesn't matter / That's okay."

- category: "HSK1 - Lesson 2"
  phrases:
    - chinese: "谢谢。"
      pinyin: "Xièxie."
      meaning: "Thank you."
    - chinese: "谢谢你。"
      pinyin: "Xièxie nǐ."
      meaning: "Thank you."
    - chinese: "不谢。"
      pinyin: "Bú xiè."
      meaning: "Don't mention it."
    - chinese: "不客气。"
      pinyin: "Bú kèqi."
      meaning: "You're welcome."
    - chinese: "再见。"
      pinyin: "Zàijiàn."
      meaning: "Goodbye."

- category: "HSK1 - Lesson 3"
  phrases:
    - chinese: "你叫什么名字？"
      pinyin: "Nǐ jiào shénme míngzì?"
      meaning: "What is your name?"
    - chinese: "我叫李月。"
      pinyin: "Wǒ jiào Lǐ Yuè."
      meaning: "My name is Li Yue."
    - chinese: "你是老师吗？"
      pinyin: "Nǐ shì lǎoshī ma?"
      meaning: "Are you a teacher?"
    - chinese: "我不是老师。"
      pinyin: "Wǒ bú shì lǎoshī."
      meaning: "I am not a teacher."
    - chinese: "我是学生。"
      pinyin: "Wǒ shì xuésheng."
      meaning: "I am a student."
    - chinese: "你是中国人吗？"
      pinyin: "Nǐ shì Zhōngguórén ma?"
      meaning: "Are you Chinese?"
    - chinese: "我不是中国人。"
      pinyin: "Wǒ bú shì Zhōngguórén."
      meaning: "I am not Chinese."
    - chinese: "我是美国人。"
      pinyin: "Wǒ shì Měiguórén."
      meaning: "I am American."
    - chinese: "这是什么？"
      pinyin: "Zhè shì shénme?"
      meaning: "What is this?"
    - chinese: "这是什么书？"
      pinyin: "Zhè shì shénme shū?"
      meaning: "What book is this?"

- category: "HSK1 - Lesson 4"
  phrases:
    - chinese: "她是谁？"
      pinyin: "Tā shì shéi?"
      meaning: "Who is she?"
    - chinese: "她是我的汉语老师。"
      pinyin: "Tā shì wǒ de Hànyǔ lǎoshī."
      meaning: "She is my Chinese teacher."
    - chinese: "你是哪国人？"
      pinyin: "Nǐ shì nǎ guó rén?"
      meaning: "What country are you from?"
    - chinese: "我是美国人，你呢？"
      pinyin: "Wǒ shì Měiguórén, nǐ ne?"
      meaning: "I am American, and you?"
    - chinese: "他是他同学吗？"
      pinyin: "Tā shì tā tóngxué ma?"
      meaning: "Is he his classmate?"
    - chinese: "他不是我同学。"
      pinyin: "Tā bú shì wǒ tóngxué."
      meaning: "He is not my classmate."
    - chinese: "他是我朋友。"
      pinyin: "Tā shì wǒ péngyou."
      meaning: "He is my friend."
    - chinese: "谁是李月？"
      pinyin: "Shéi shì Lǐ Yuè?"
      meaning: "Who is Li Yue?"
    - chinese: "哪个是你的老师？"
      pinyin: "Nǎge shì nǐ de lǎoshī?"
      meaning: "Which one is your teacher?"
    - chinese: "她是我同学，不是我朋友。"
      pinyin: "Tā shì wǒ tóngxué, bú shì wǒ péngyou."
      meaning: "She is my classmate, not my friend."

- category: "HSK1 - Lesson 5"
  phrases:
    - chinese: "你家有几口人？"
      pinyin: "Nǐ jiā yǒu jǐ kǒu rén?"
      meaning: "How many people are there in your family?"
    - chinese: "我家有三口人。"
      pinyin: "Wǒ jiā yǒu sān kǒu rén."
      meaning: "There are three people in my family."
    - chinese: "你女儿几岁了？"
      pinyin: "Nǐ nǚ'ér jǐ suì le?"
      meaning: "How old is your daughter?"
    - chinese: "她今年四岁了。"
      pinyin: "Tā jīnnián sì suì le."
      meaning: "She is four years old this year."
    - chinese: "李老师多大了？"
      pinyin: "Lǐ lǎoshī duō dà le?"
      meaning: "How old is Teacher Li?"
    - chinese: "她今年五十岁了。"
      pinyin: "Tā jīnnián wǔshí suì le."
      meaning: "She is fifty years old this year."
    - chinese: "你儿子几岁了？"
      pinyin: "Nǐ érzi jǐ suì le?"
      meaning: "How old is your son?"
    - chinese: "我家有五口人。"
      pinyin: "Wǒ jiā yǒu wǔ kǒu rén."
      meaning: "There are five people in my family."
    - chinese: "你多大了？"
      pinyin: "Nǐ duō dà le?"
      meaning: "How old are you?"
    - chinese: "我朋友的女儿今年二十岁。"
      pinyin: "Wǒ péngyou de nǚ'ér jīnnián èrshí suì."
      meaning: "My friend's daughter is twenty years old this year."

- category: "HSK1 - Lesson 6"
  phrases:
    - chinese: "你会说汉语吗？"
      pinyin: "Nǐ huì shuō Hànyǔ ma?"
      meaning: "Can you speak Chinese?"
    - chinese: "我会说汉语。"
      pinyin: "Wǒ huì shuō Hànyǔ."
      meaning: "I can speak Chinese."
    - chinese: "你妈妈会说汉语吗？"
      pinyin: "Nǐ māma huì shuō Hànyǔ ma?"
      meaning: "Can your mother speak Chinese?"
    - chinese: "她不会说汉语。"
      pinyin: "Tā bú huì shuō Hànyǔ."
      meaning: "She cannot speak Chinese."
    - chinese: "中国菜好吃吗？"
      pinyin: "Zhōngguócài hǎochī ma?"
      meaning: "Is Chinese food delicious?"
    - chinese: "中国菜很好吃。"
      pinyin: "Zhōngguócài hěn hǎochī."
      meaning: "Chinese food is very delicious."
    - chinese: "你会做中国菜吗？"
      pinyin: "Nǐ huì zuò Zhōngguócài ma?"
      meaning: "Can you cook Chinese food?"
    - chinese: "我不会做中国菜。"
      pinyin: "Wǒ bú huì zuò Zhōngguócài."
      meaning: "I cannot cook Chinese food."
    - chinese: "这个汉字怎么写？"
      pinyin: "Zhège Hànzì zěnme xiě?"
      meaning: "How do you write this Chinese character?"
    - chinese: "这个字我会读，不会写。"
      pinyin: "Zhège zì wǒ huì dú, bú huì xiě."
      meaning: "I can read this character, but I cannot write it."

- category: "HSK1 - Lesson 7"
  phrases:
    - chinese: "今天是几月几号？"
      pinyin: "Jīntiān shì jǐ yuè jǐ hào?"
      meaning: "What is the date today?"
    - chinese: "今天是九月一号，星期三。"
      pinyin: "Jīntiān shì jiǔyuè yī hào, xīngqīsān."
      meaning: "Today is September 1st, Wednesday."
    - chinese: "昨天是几月几号？"
      pinyin: "Zuótiān shì jǐ yuè jǐ hào?"
      meaning: "What was the date yesterday?"
    - chinese: "昨天是八月三十一号，星期二。"
      pinyin: "Zuótiān shì bāyuè sānshíyī hào, xīngqī'èr."
      meaning: "Yesterday was August 31st, Tuesday."
    - chinese: "明天星期四。"
      pinyin: "Míngtiān xīngqīsì."
      meaning: "Tomorrow is Thursday."
    - chinese: "明天你去学校吗？"
      pinyin: "Míngtiān nǐ qù xuéxiào ma?"
      meaning: "Are you going to school tomorrow?"
    - chinese: "我去学校看书。"
      pinyin: "Wǒ qù xuéxiào kànshū."
      meaning: "I am going to school to read."
    - chinese: "我们去中国饭馆儿吃中国菜。"
      pinyin: "Wǒmen qù Zhōngguó fànguǎnr chī Zhōngguócài."
      meaning: "We are going to a Chinese restaurant to eat Chinese food."
    - chinese: "我去中国学习汉语。"
      pinyin: "Wǒ qù Zhōngguó xuéxí Hànyǔ."
      meaning: "I am going to China to study Chinese."
    - chinese: "昨天星期一，我不去学校。"
      pinyin: "Zuótiān xīngqīyī, wǒ bú qù xuéxiào."
      meaning: "Yesterday was Monday, I didn't go to school."

- category: "HSK1 - Lesson 8"
  phrases:
    - chinese: "你想喝什么？"
      pinyin: "Nǐ xiǎng hē shénme?"
      meaning: "What would you like to drink?"
    - chinese: "我想喝茶。"
      pinyin: "Wǒ xiǎng hē chá."
      meaning: "I would like to drink tea."
    - chinese: "你想吃什么？"
      pinyin: "Nǐ xiǎng chī shénme?"
      meaning: "What would you like to eat?"
    - chinese: "我想吃米饭。"
      pinyin: "Wǒ xiǎng chī mǐfàn."
      meaning: "I would like to eat rice."
    - chinese: "下午你想做什么？"
      pinyin: "Xiàwǔ nǐ xiǎng zuò shénme?"
      meaning: "What would you like to do this afternoon?"
    - chinese: "下午我想去商店。"
      pinyin: "Xiàwǔ wǒ xiǎng qù shāngdiàn."
      meaning: "I would like to go to the store this afternoon."
    - chinese: "你想买什么？"
      pinyin: "Nǐ xiǎng mǎi shénme?"
      meaning: "What do you want to buy?"
    - chinese: "我想买一个杯子。"
      pinyin: "Wǒ xiǎng mǎi yígè bēizi."
      meaning: "I want to buy a cup."
    - chinese: "这个杯子多少钱？"
      pinyin: "Zhège bēizi duōshǎo qián?"
      meaning: "How much is this cup?"
    - chinese: "这个杯子二十八块。"
      pinyin: "Zhège bēizi èrshíbā kuài."
      meaning: "This cup is 28 yuan."
    - chinese: "那个杯子十八块钱。"
      pinyin: "Nàge bēizi shíbā kuài qián."
      meaning: "That cup is 18 yuan."
    - chinese: "你有多少个汉语老师？"
      pinyin: "Nǐ yǒu duōshǎo gè Hànyǔ lǎoshī?"
      meaning: "How many Chinese teachers do you have?"
    - chinese: "你们学校有多少个学生？"
      pinyin: "Nǐmen xuéxiào yǒu duōshǎo gè xuésheng?"
      meaning: "How many students are there in your school?"
    - chinese: "我买五个杯子。"
      pinyin: "Wǒ mǎi wǔ gè bēizi."
      meaning: "I'll buy five cups."
    - chinese: "我想买一个大杯子。"
      pinyin: "Wǒ xiǎng mǎi yígè dà bēizi."
      meaning: "I want to buy a big cup."

- category: "HSK1 - Lesson 9"
  phrases:
    - chinese: "小猫在哪儿？"
      pinyin: "Xiǎomāo zài nǎr?"
      meaning: "Where is the kitten?"
    - chinese: "小猫在那儿。"
      pinyin: "Xiǎomāo zài nàr."
      meaning: "The kitten is over there."
    - chinese: "小狗在椅子下面。"
      pinyin: "Xiǎogǒu zài yǐzi xiàmiàn."
      meaning: "The puppy is under the chair."
    - chinese: "你在哪儿工作？"
      pinyin: "Nǐ zài nǎr gōngzuò?"
      meaning: "Where do you work?"
    - chinese: "我在学校工作。"
      pinyin: "Wǒ zài xuéxiào gōngzuò."
      meaning: "I work at a school."
    - chinese: "你儿子在哪儿工作？"
      pinyin: "Nǐ érzi zài nǎr gōngzuò?"
      meaning: "Where does your son work?"
    - chinese: "我儿子在医院工作。"
      pinyin: "Wǒ érzi zài yīyuàn gōngzuò."
      meaning: "My son works at a hospital."
    - chinese: "他是医生。"
      pinyin: "Tā shì yīshēng."
      meaning: "He is a doctor."
    - chinese: "你爸爸在家吗？"
      pinyin: "Nǐ bàba zài jiā ma?"
      meaning: "Is your father at home?"
    - chinese: "他不在家，他在医院。"
      pinyin: "Tā bú zài jiā, tā zài yīyuàn."
      meaning: "He is not at home, he is at the hospital."
    - chinese: "我的杯子在哪儿？"
      pinyin: "Wǒ de bēizi zài nǎr?"
      meaning: "Where is my cup?"
    - chinese: "我的杯子在桌子上。"
      pinyin: "Wǒ de bēizi zài zhuōzi shàng."
      meaning: "My cup is on the table."
    - chinese: "你的小猫呢？"
      pinyin: "Nǐ de xiǎomāo ne?"
      meaning: "What about your kitten?"
    - chinese: "我在朋友家喝茶。"
      pinyin: "Wǒ zài péngyou jiā hē chá."
      meaning: "I am drinking tea at a friend's house."
    - chinese: "他们在学校看书。"
      pinyin: "Tāmen zài xuéxiào kànshū."
      meaning: "They are reading at school."

- category: "HSK1 - Lesson 10"
  phrases:
    - chinese: "桌子上有什么？"
      pinyin: "Zhuōzi shàng yǒu shénme?"
      meaning: "What is on the table?"
    - chinese: "桌子上有一个电脑和一本书。"
      pinyin: "Zhuōzi shàng yǒu yígè diànnǎo hé yì běn shū."
      meaning: "There is a computer and a book on the table."
    - chinese: "杯子在桌子里面。"
      pinyin: "Bēizi zài zhuōzi lǐmiàn."
      meaning: "The cup is inside the desk."
    - chinese: "椅子下面有一只小狗。"
      pinyin: "Yǐzi xiàmiàn yǒu yì zhī xiǎogǒu."
      meaning: "There is a puppy under the chair."
    - chinese: "学校里有一个商店。"
      pinyin: "Xuéxiào lǐ yǒu yígè shāngdiàn."
      meaning: "There is a store in the school."
    - chinese: "桌子上没有电脑。"
      pinyin: "Zhuōzi shàng méiyǒu diànnǎo."
      meaning: "There is no computer on the table."
    - chinese: "学校里没有医生。"
      pinyin: "Xuéxiào lǐ méiyǒu yīshēng."
      meaning: "There are no doctors in the school."
    - chinese: "我有一个中国朋友和一个美国朋友。"
      pinyin: "Wǒ yǒu yígè Zhōngguó péngyou hé yígè Měiguó péngyou."
      meaning: "I have a Chinese friend and an American friend."
    - chinese: "我能坐这儿吗？"
      pinyin: "Wǒ néng zuò zhèr ma?"
      meaning: "Can I sit here?"
    - chinese: "你能在这儿写名字吗？"
      pinyin: "Nǐ néng zài zhèr xiě míngzì ma?"
      meaning: "Can you write your name here?"
    - chinese: "请坐。"
      pinyin: "Qǐng zuò."
      meaning: "Please sit down."
    - chinese: "请喝茶。"
      pinyin: "Qǐng hē chá."
      meaning: "Please drink some tea."
    - chinese: "请写您的名字。"
      pinyin: "Qǐng xiě nín de míngzì."
      meaning: "Please write your name."
    - chinese: "前面那个人叫什么名字？"
      pinyin: "Qiánmiàn nàge rén jiào shénme míngzì?"
      meaning: "What is the name of the person in front?"
    - chinese: "后面那个人是我同学。"
      pinyin: "Hòumiàn nàge rén shì wǒ tóngxué."
      meaning: "The person behind is my classmate."

- category: "HSK1 - Lesson 11"
  phrases:
    - chinese: "现在几点？"
      pinyin: "Xiànzài jǐ diǎn?"
      meaning: "What time is it now?"
    - chinese: "现在十点十分。"
      pinyin: "Xiànzài shí diǎn shí fēn."
      meaning: "It is 10:10 now."
    - chinese: "中午十二点吃饭。"
      pinyin: "Zhōngwǔ shí'èr diǎn chīfàn."
      meaning: "Eat at 12:00 PM."
    - chinese: "爸爸什么时候回家？"
      pinyin: "Bàba shénme shíhou huíjiā?"
      meaning: "When is dad coming home?"
    - chinese: "爸爸下午五点回家。"
      pinyin: "Bàba xiàwǔ wǔ diǎn huíjiā."
      meaning: "Dad comes home at 5:00 PM."
    - chinese: "我们六点三十分去看电影。"
      pinyin: "Wǒmen liù diǎn sānshí fēn qù kàn diànyǐng."
      meaning: "We are going to see a movie at 6:30."
    - chinese: "我星期一去北京。"
      pinyin: "Wǒ xīngqīyī qù Běijīng."
      meaning: "I am going to Beijing on Monday."
    - chinese: "你在北京住几天？"
      pinyin: "Nǐ zài Běijīng zhù jǐ tiān?"
      meaning: "How many days are you staying in Beijing?"
    - chinese: "我在北京住三天。"
      pinyin: "Wǒ zài Běijīng zhù sān tiān."
      meaning: "I am staying in Beijing for three days."
    - chinese: "星期五前能回家吗？"
      pinyin: "Xīngqīwǔ qián néng huíjiā ma?"
      meaning: "Can you come home before Friday?"
    - chinese: "八点前我去学校。"
      pinyin: "Bā diǎn qián wǒ qù xuéxiào."
      meaning: "I go to school before 8 o'clock."
    - chinese: "妈妈六点做饭。"
      pinyin: "Māma liù diǎn zuòfàn."
      meaning: "Mom cooks at 6 o'clock."
    - chinese: "星期六前能回北京吗？"
      pinyin: "Xīngqīliù qián néng huí Běijīng ma?"
      meaning: "Can you return to Beijing before Saturday?"
    - chinese: "下午三点十分我去商店。"
      pinyin: "Xiàwǔ sān diǎn shí fēn wǒ qù shāngdiàn."
      meaning: "I am going to the store at 3:10 PM."
    - chinese: "现在是两点零五分。"
      pinyin: "Xiànzài shì liǎng diǎn líng wǔ fēn."
      meaning: "It is 2:05 now."

- category: "HSK1 - Lesson 12"
  phrases:
    - chinese: "昨天北京的天气怎么样？"
      pinyin: "Zuótiān Běijīng de tiānqì zěnmeyàng?"
      meaning: "How was the weather in Beijing yesterday?"
    - chinese: "昨天天气太热了。"
      pinyin: "Zuótiān tiānqì tài rè le."
      meaning: "The weather was too hot yesterday."
    - chinese: "明天天气怎么样？"
      pinyin: "Míngtiān tiānqì zěnmeyàng?"
      meaning: "How will the weather be tomorrow?"
    - chinese: "明天天气很好。"
      pinyin: "Míngtiān tiānqì hěn hǎo."
      meaning: "Tomorrow's weather will be very good."
    - chinese: "明天不冷不热。"
      pinyin: "Míngtiān bù lěng bú rè."
      meaning: "Tomorrow will be neither cold nor hot."
    - chinese: "今天会下雨吗？"
      pinyin: "Jīntiān huì xià yǔ ma?"
      meaning: "Will it rain today?"
    - chinese: "今天不会下雨。"
      pinyin: "Jīntiān bú huì xià yǔ."
      meaning: "It won't rain today."
    - chinese: "王小姐今天会来吗？"
      pinyin: "Wáng xiǎojiě jīntiān huì lái ma?"
      meaning: "Will Miss Wang come today?"
    - chinese: "她不会来，天气太冷了。"
      pinyin: "Tā bú huì lái, tiānqì tài lěng le."
      meaning: "She won't come; the weather is too cold."
    - chinese: "你身体怎么样？"
      pinyin: "Nǐ shēntǐ zěnmeyàng?"
      meaning: "How is your health?"
    - chinese: "我身体不太好。"
      pinyin: "Wǒ shēntǐ bú tài hǎo."
      meaning: "I'm not feeling very well."
    - chinese: "你多吃些水果，多喝水。"
      pinyin: "Nǐ duō chī xiē shuǐguǒ, duō hē shuǐ."
      meaning: "You should eat more fruit and drink more water."
    - chinese: "爸爸八点前会回家。"
      pinyin: "Bàba bā diǎn qián huì huíjiā."
      meaning: "Dad will be home before 8 o'clock."
    - chinese: "我不爱吃饭。"
      pinyin: "Wǒ bú ài chīfàn."
      meaning: "I don't feel like eating."
    - chinese: "我的汉语老师身体很好。"
      pinyin: "Wǒ de Hànyǔ lǎoshī shēntǐ hěn hǎo."
      meaning: "My Chinese teacher is in very good health."

- category: "HSK1 - Lesson 13"
  phrases:
    - chinese: "喂，你在做什么呢？"
      pinyin: "Wéi, nǐ zài zuò shénme ne?"
      meaning: "Hello, what are you doing?"
    - chinese: "我在看书呢。"
      pinyin: "Wǒ zài kànshū ne."
      meaning: "I am reading."
    - chinese: "大卫在学做中国菜呢。"
      pinyin: "Dàwèi zài xué zuò Zhōngguócài ne."
      meaning: "David is learning to cook Chinese food."
    - chinese: "他没看书。"
      pinyin: "Tā méi kànshū."
      meaning: "He isn't reading."
    - chinese: "我在睡觉呢。"
      pinyin: "Wǒ zài shuìjiào ne."
      meaning: "I am sleeping."
    - chinese: "我没在工作，我在看电视。"
      pinyin: "Wǒ méi zài gōngzuò, wǒ zài kàn diànshì."
      meaning: "I'm not working, I'm watching TV."
    - chinese: "你喜欢看电视吗？"
      pinyin: "Nǐ xǐhuān kàn diànshì ma?"
      meaning: "Do you like watching TV?"
    - chinese: "我不喜欢看电视，我喜欢看电影。"
      pinyin: "Wǒ bù xǐhuān kàn diànshì, wǒ xǐhuān kàn diànyǐng."
      meaning: "I don't like watching TV, I like watching movies."
    - chinese: "你的电话是多少？"
      pinyin: "Nǐ de diànhuà shì duōshǎo?"
      meaning: "What is your phone number?"
    - chinese: "她的电话是八二三零四一五六。"
      pinyin: "Tā de diànhuà shì bā èr sān líng sì yī wǔ liù."
      meaning: "Her phone number is 82304156."
    - chinese: "她在工作呢，你下午打吧。"
      pinyin: "Tā zài gōngzuò ne, nǐ xiàwǔ dǎ ba."
      meaning: "She is working; call her this afternoon."
    - chinese: "我们今天在饭馆儿吃饭吧。"
      pinyin: "Wǒmen jīntiān zài fànguǎnr chīfàn ba."
      meaning: "Let's eat at a restaurant today."
    - chinese: "这儿没有人，请坐吧。"
      pinyin: "Zhèr méiyǒu rén, qǐng zuò ba."
      meaning: "There is no one here, please sit down."
    - chinese: "请喝茶吧。"
      pinyin: "Qǐng hē chá ba."
      meaning: "Please have some tea."
    - chinese: "我现在给她打电话。"
      pinyin: "Wǒ xiànzài gěi tā dǎ diànhuà."
      meaning: "I'll call her now."

- category: "HSK1 - Lesson 14"
  phrases:
    - chinese: "昨天上午你去哪儿了？"
      pinyin: "Zuótiān shàngwǔ nǐ qù nǎr le?"
      meaning: "Where did you go yesterday morning?"
    - chinese: "我去商店买东西了。"
      pinyin: "Wǒ qù shāngdiàn mǎi dōngxi le."
      meaning: "I went to the store to go shopping."
    - chinese: "你买什么了？"
      pinyin: "Nǐ mǎi shénme le?"
      meaning: "What did you buy?"
    - chinese: "我买了一点儿苹果。"
      pinyin: "Wǒ mǎile yìdiǎnr píngguǒ."
      meaning: "I bought some apples."
    - chinese: "你看见张先生了吗？"
      pinyin: "Nǐ kànjiàn Zhāng xiānsheng le ma?"
      meaning: "Did you see Mr. Zhang?"
    - chinese: "看见了，他去学开车了。"
      pinyin: "Kànjiàn le, tā qù xué kāichē le."
      meaning: "Yes, he went to learn to drive."
    - chinese: "他四十分钟后回来。"
      pinyin: "Tā sìshí fēnzhōng hòu huílái."
      meaning: "He will be back in 40 minutes."
    - chinese: "王方的衣服太漂亮了！"
      pinyin: "Wáng Fāng de yīfu tài piàoliang le!"
      meaning: "Wang Fang's clothes are so beautiful!"
    - chinese: "是啊，她买了不少衣服。"
      pinyin: "Shì a, tā mǎile bùshǎo yīfu."
      meaning: "Yes, she bought quite a few clothes."
    - chinese: "我没买，这些都是王方的东西。"
      pinyin: "Wǒ méi mǎi, zhèxiē dōu shì Wáng Fāng de dōngxi."
      meaning: "I didn't buy anything; these are all Wang Fang's things."
    - chinese: "我们都是中国人。"
      pinyin: "Wǒmen dōu shì Zhōngguórén."
      meaning: "We are all Chinese."
    - chinese: "他们都喜欢喝茶。"
      pinyin: "Tāmen dōu xǐhuān hē chá."
      meaning: "They both like drinking tea."
    - chinese: "五点后我回家。"
      pinyin: "Wǔ diǎn hòu wǒ huíjiā."
      meaning: "I'll go home after 5 o'clock."
    - chinese: "星期三后他去北京。"
      pinyin: "Xīngqīsān hòu tā qù Běijīng."
      meaning: "He is going to Beijing after Wednesday."
    - chinese: "好啊，我们去吃中国菜。"
      pinyin: "Hǎo a, wǒmen qù chī Zhōngguócài."
      meaning: "Great, let's go eat Chinese food."

- category: "HSK1 - Lesson 15"
  phrases:
    - chinese: "你和李小姐是什么时候认识的？"
      pinyin: "Nǐ hé Lǐ xiǎojiě shì shénme shíhou rènshi de?"
      meaning: "When did you and Miss Li meet?"
    - chinese: "我们是二零一一年九月认识的。"
      pinyin: "Wǒmen shì èr líng yī yī nián jiǔyuè rènshi de."
      meaning: "We met in September 2011."
    - chinese: "你们是在哪儿认识的？"
      pinyin: "Nǐmen shì zài nǎr rènshi de?"
      meaning: "Where did you meet?"
    - chinese: "我们是在学校认识的。"
      pinyin: "Wǒmen shì zài xuéxiào rènshi de."
      meaning: "We met at school."
    - chinese: "她是我大学同学。"
      pinyin: "Tā shì wǒ dàxué tóngxué."
      meaning: "She is my college classmate."
    - chinese: "你们是怎么来饭店的？"
      pinyin: "Nǐmen shì zěnme lái fàndiàn de?"
      meaning: "How did you get to the restaurant?"
    - chinese: "我们是坐出租车来的。"
      pinyin: "Wǒmen shì zuò chūzūchē lái de."
      meaning: "We came by taxi."
    - chinese: "李先生是和朋友一起开车来的。"
      pinyin: "Lǐ xiānsheng shì hé péngyou yìqǐ kāichē lái de."
      meaning: "Mr. Lee came by car with a friend."
    - chinese: "很高兴认识您！"
      pinyin: "Hěn gāoxìng rènshi nín!"
      meaning: "Nice to meet you!"
    - chinese: "认识你我也很高兴。"
      pinyin: "Rènshi nǐ wǒ yě hěn gāoxìng."
      meaning: "Nice to meet you too."
    - chinese: "您是坐飞机来北京的吗？"
      pinyin: "Nín shì zuò fēijī lái Běijīng de ma?"
      meaning: "Did you come to Beijing by plane?"
    - chinese: "是的，我是坐飞机来的。"
      pinyin: "Shì de, wǒ shì zuò fēijī lái de."
      meaning: "Yes, I came by plane."
    - chinese: "我不是昨天来的。"
      pinyin: "Wǒ bú shì zuótiān lái de."
      meaning: "I didn't come yesterday."
    - chinese: "这是在北京买的。"
      pinyin: "Zhè shì zài Běijīng mǎi de."
      meaning: "This was bought in Beijing."
    - chinese: "明天是二零一四年五月十一号，星期日。"
      pinyin: "Míngtiān shì èr líng yī sì nián wǔyuè shíyī hào, xīngqīrì."
      meaning: "Tomorrow is Sunday, May 11th, 2014."