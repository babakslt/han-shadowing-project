
- category: "About Iran – Shiraz & Isfahan"
  phrases:
    - chinese: "欢迎来伊朗！"
      pinyin: "Huānyíng lái Yīlǎng!"
      meaning: "Welcome to Iran!"
    - chinese: "你们现在在设拉子，这是很美的城市。"
      pinyin: "Nǐmen xiànzài zài Shèlāzǐ, zhè shì hěn měi de chéngshì."
      meaning: "You’re now in Shiraz—it’s a very beautiful city."
    - chinese: "设拉子是诗人之城。"
      pinyin: "Shèlāzǐ shì shīrén zhī chéng."
      meaning: "Shiraz is the city of poets."
    - chinese: "你们可以去哈菲兹墓。"
      pinyin: "Nǐmen kěyǐ qù Hāfěizī mù."
      meaning: "You can visit Hafez’s tomb."
    - chinese: "伊斯法罕也很有名。"
      pinyin: "Yīsīfǎhǎn yě hěn yǒumíng."
      meaning: "Isfahan is also very famous."
    - chinese: "伊斯法罕有伊玛目广场。"
      pinyin: "Yīsīfǎhǎn yǒu Yīmǎmù Guǎngchǎng."
      meaning: "Isfahan has Imam Square."
    - chinese: "伊玛目广场很大，很漂亮。"
      pinyin: "Yīmǎmù Guǎngchǎng hěn dà, hěn piàoliang."
      meaning: "Imam Square is big and beautiful."
    - chinese: "伊朗的清真寺很有历史。"
      pinyin: "Yīlǎng de qīngzhēnsì hěn yǒu lìshǐ."
      meaning: "Iran’s mosques are very historical."
    - chinese: "波斯花园很安静。"
      pinyin: "Bōsī huāyuán hěn ānjìng."
      meaning: "Persian gardens are very peaceful."
    - chinese: "我们伊朗人很友好。"
      pinyin: "Wǒmen Yīlǎng rén hěn yǒuhǎo."
      meaning: "We Iranians are very friendly."

- category: "Starting a Friendly Chat"
  phrases:
    - chinese: "你们是中国人吗？"
      pinyin: "Nǐmen shì Zhōngguó rén ma?"
      meaning: "Are you Chinese?"
    - chinese: "你们从中国哪里来？"
      pinyin: "Nǐmen cóng Zhōngguó nǎlǐ lái?"
      meaning: "Where in China are you from?"
    - chinese: "你们喜欢伊朗吗？"
      pinyin: "Nǐmen xǐhuān Yīlǎng ma?"
      meaning: "Do you like Iran?"
    - chinese: "你们来伊朗多久了？"
      pinyin: "Nǐmen lái Yīlǎng duō jiǔ le?"
      meaning: "How long have you been in Iran?"
    - chinese: "你们想去哪里玩？"
      pinyin: "Nǐmen xiǎng qù nǎlǐ wán?"
      meaning: "Where do you want to go for fun?"
    - chinese: "需要帮忙吗？"
      pinyin: "Xūyào bāngmáng ma?"
      meaning: "Do you need help?"
    - chinese: "我可以帮你们拍照。"
      pinyin: "Wǒ kěyǐ bāng nǐmen pāizhào."
      meaning: "I can take a photo for you."
    - chinese: "你们觉得设拉子怎么样？"
      pinyin: "Nǐmen juéde Shèlāzǐ zěnmeyàng?"
      meaning: "What do you think of Shiraz?"
    - chinese: "你们吃过伊朗菜了吗？"
      pinyin: "Nǐmen chī guo Yīlǎng cài le ma?"
      meaning: "Have you tried Iranian food?"
    - chinese: "伊朗饭很好吃！"
      pinyin: "Yīlǎng fàn hěn hǎochī!"
      meaning: "Iranian food is delicious!"

- category: "Sharing My Interest in China"
  phrases:
    - chinese: "我喜欢中国茶。"
      pinyin: "Wǒ xǐhuān Zhōngguó chá."
      meaning: "I like Chinese tea."
    - chinese: "我看过中国电影。"
      pinyin: "Wǒ kànguò Zhōngguó diànyǐng."
      meaning: "I’ve watched Chinese movies."
    - chinese: "中国有五千年的历史。"
      pinyin: "Zhōngguó yǒu wǔ qiān nián de lìshǐ."
      meaning: "China has 5,000 years of history."
    - chinese: "长城很了不起。"
      pinyin: "Chángchéng hěn liǎobuqǐ."
      meaning: "The Great Wall is amazing."
    - chinese: "我知道毛泽东。"
      pinyin: "Wǒ zhīdào Máo Zédōng."
      meaning: "I know Mao Zedong."
    - chinese: "中国革命很重要。"
      pinyin: "Zhōngguó gémìng hěn zhòngyào."
      meaning: "The Chinese revolution is very important."
    - chinese: "我想学更多关于中国的事。"
      pinyin: "Wǒ xiǎng xué gèng duō guānyú Zhōngguó de shì."
      meaning: "I want to learn more about China."
    - chinese: "你们能教我几个中文词吗？"
      pinyin: "Nǐmen néng jiāo wǒ jǐ gè Zhōngwén cí ma?"
      meaning: "Can you teach me a few Chinese words?"
    - chinese: "谢谢你们和我说话！"
      pinyin: "Xièxie nǐmen hé wǒ shuōhuà!"
      meaning: "Thank you for talking with me!"
    - chinese: "希望你们在伊朗玩得开心！"
      pinyin: "Xīwàng nǐmen zài Yīlǎng wán de kāixīn!"
      meaning: "Hope you have a great time in Iran!"