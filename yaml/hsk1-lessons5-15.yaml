      pinyin: "Wǒ méiyǒu zìdiǎn."
      meaning: "I don’t have a dictionary."
    - chinese: "他有手机。"
      pinyin: "Tā yǒu shǒujī."
      meaning: "He has a phone."
    - chinese: "我们有五个人。"
      pinyin: "Wǒmen yǒu wǔ gè rén."
      meaning: "We have five people."
    - chinese: "你有几个朋友？"
      pinyin: "Nǐ yǒu jǐ gè péngyou?"
      meaning: "How many friends do you have?"
    - chinese: "我有一个妹妹。"
