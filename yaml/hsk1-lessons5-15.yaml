
- category: "Lesson 5"
  phrases:
    - chinese: "你是老师吗？"
      pinyin: "Nǐ shì lǎoshī ma?"
      meaning: "Are you a teacher?"
    - chinese: "我不是学生。"
      pinyin: "Wǒ bú shì xuéshēng."
      meaning: "I am not a student."
    - chinese: "李月是中国人。"
      pinyin: "Lǐ Yuè shì Zhōngguó rén."
      meaning: "Li Yue is Chinese."
    - chinese: "大卫是美国人。"
      pinyin: "Dàwèi shì Měiguó rén."
      meaning: "David is American."
    - chinese: "他是谁？"
      pinyin: "Tā shì shéi?"
      meaning: "Who is he?"
    - chinese: "这是我的书。"
      pinyin: "Zhè shì wǒ de shū."
      meaning: "This is my book."
    - chinese: "那是你的杯子吗？"
      pinyin: "Nà shì nǐ de bēizi ma?"
      meaning: "Is that your cup?"
    - chinese: "这是谢朋的手机。"
      pinyin: "Zhè shì Xiè Péng de shǒujī."
      meaning: "This is Xie Peng’s phone."
    - chinese: "我姓王。"
      pinyin: "Wǒ xìng Wáng."
      meaning: "My last name is Wang."
    - chinese: "她姓李。"
      pinyin: "Tā xìng Lǐ."
      meaning: "Her last name is Li."
    - chinese: "老师好！"
      pinyin: "Lǎoshī hǎo!"
      meaning: "Hello, teacher!"
    - chinese: "同学们好！"
      pinyin: "Tóngxuémen hǎo!"
      meaning: "Hello, everyone!"
    - chinese: "我是伊朗人。"
      pinyin: "Wǒ shì Yīlǎng rén."
      meaning: "I am Iranian."
    - chinese: "你叫什么名字？"
      pinyin: "Nǐ jiào shénme míngzì?"
      meaning: "What’s your name?"
    - chinese: "我叫李月。"
      pinyin: "Wǒ jiào Lǐ Yuè."
      meaning: "My name is Li Yue."
    - chinese: "他是老师还是学生？"
      pinyin: "Tā shì lǎoshī háishì xuéshēng?"
      meaning: "Is he a teacher or a student?"
    - chinese: "这是我爸爸。"
      pinyin: "Zhè shì wǒ bàba."
      meaning: "This is my dad."
    - chinese: "那是我妈妈。"
      pinyin: "Nà shì wǒ māma."
      meaning: "That is my mom."
    - chinese: "我们是朋友。"
      pinyin: "Wǒmen shì péngyou."
      meaning: "We are friends."
    - chinese: "他们不是中国人。"
      pinyin: "Tāmen bú shì Zhōngguó rén."
      meaning: "They are not Chinese."

- category: "Lesson 6"
  phrases:
    - chinese: "这是哪本书？"
      pinyin: "Zhè shì nǎ běn shū?"
      meaning: "Which book is this?"
    - chinese: "哪个是你？"
      pinyin: "Nǎge shì nǐ?"
      meaning: "Which one is you?"
    - chinese: "你是哪国人？"
      pinyin: "Nǐ shì nǎ guó rén?"
      meaning: "What country are you from?"
    - chinese: "这是我的。"
      pinyin: "Zhè shì wǒ de."
      meaning: "This is mine."
    - chinese: "那本书是他的。"
      pinyin: "Nà běn shū shì tā de."
      meaning: "That book is his."
    - chinese: "李月的家在北京。"
      pinyin: "Lǐ Yuè de jiā zài Běijīng."
      meaning: "Li Yue’s home is in Beijing."
    - chinese: "大卫的中文很好。"
      pinyin: "Dàwèi de Zhōngwén hěn hǎo."
      meaning: "David’s Chinese is very good."
    - chinese: "这是老师的手机。"
      pinyin: "Zhè shì lǎoshī de shǒujī."
      meaning: "This is the teacher’s phone."
    - chinese: "我朋友的爸爸是医生。"
      pinyin: "Wǒ péngyou de bàba shì yīshēng."
      meaning: "My friend’s dad is a doctor."
    - chinese: "这是你的书包吗？"
      pinyin: "Zhè shì nǐ de shūbāo ma?"
      meaning: "Is this your schoolbag?"
    - chinese: "我的杯子在桌子上。"
      pinyin: "Wǒ de bēizi zài zhuōzi shàng."
      meaning: "My cup is on the table."
    - chinese: "他的手机在包里。"
      pinyin: "Tā de shǒujī zài bāo lǐ."
      meaning: "His phone is in the bag."
    - chinese: "这是谁的书？"
      pinyin: "Zhè shì shéi de shū?"
      meaning: "Whose book is this?"
    - chinese: "这是我的汉语书。"
      pinyin: "Zhè shì wǒ de Hànyǔ shū."
      meaning: "This is my Chinese book."
    - chinese: "那是谢朋的字典。"
      pinyin: "Nà shì Xiè Péng de zìdiǎn."
      meaning: "That is Xie Peng’s dictionary."
    - chinese: "李老师的家在哪儿？"
      pinyin: "Lǐ lǎoshī de jiā zài nǎr?"
      meaning: "Where is Teacher Li’s home?"
    - chinese: "我妈妈的车是红色的。"
      pinyin: "Wǒ māma de chē shì hóngsè de."
      meaning: "My mom’s car is red."
    - chinese: "这是你们的教室吗？"
      pinyin: "Zhè shì nǐmen de jiàoshì ma?"
      meaning: "Is this your classroom?"
    - chinese: "他们的中文不太难。"
      pinyin: "Tāmen de Zhōngwén bú tài nán."
      meaning: "Their Chinese isn’t too hard."
    - chinese: "这是爸爸的茶。"
      pinyin: "Zhè shì bàba de chá."
      meaning: "This is Dad’s tea."

- category: "Lesson 7"
  phrases:
