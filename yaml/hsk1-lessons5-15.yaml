      pinyin: "Nǐ yǒu xiōngdì jiěmèi ma?"
      meaning: "Do you have siblings?"
    - chinese: "我没有哥哥。"
      pinyin: "Wǒ méiyǒu gēge."
      meaning: "I don’t have an older brother."
    - chinese: "她有两只猫。"
      pinyin: "Tā yǒu liǎng zhī māo."
      meaning: "She has two cats."
    - chinese: "超市里有水果吗？"
      pinyin: "Chāoshì lǐ yǒu shuǐguǒ ma?"
      meaning: "Is there fruit in the supermarket?"
    - chinese: "包里有一把钥匙。"
      pinyin: "Bāo lǐ yǒu yì bǎ yàoshi."
      meaning: "There is a key in the bag."
    - chinese: "你有多少本书？"
      pinyin: "Nǐ yǒu duōshǎo běn shū?"
      meaning: "How many books do you have?"
    - chinese: "我有五块钱。"
      pinyin: "Wǒ yǒu wǔ kuài qián."
      meaning: "I have five yuan."
    - chinese: "他没有电脑。"
      pinyin: "Tā méiyǒu diànnǎo."
      meaning: "He doesn’t have a computer."
    - chinese: "学校里有很多老师。"
      pinyin: "Xuéxiào lǐ yǒu hěn duō lǎoshī."
