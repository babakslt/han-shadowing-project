      pinyin: "Jīntiān xīngqíyī."
      meaning: "Today is Monday."
    - chinese: "明天星期二。"
      pinyin: "Míngtiān xīngqí'èr."
      meaning: "Tomorrow is Tuesday."
    - chinese: "昨天星期日。"
      pinyin: "Zuótiān xīngqírì."
      meaning: "Yesterday was Sunday."
    - chinese: "我周末不工作。"
      pinyin: "Wǒ zhōumò bù gōngzuò."
      meaning: "I don’t work on weekends."
    - chinese: "星期六我去公园。"
