- category: "Restaurant in Beijing"
  phrases:
    - chinese: "你们有什么菜？"
      pinyin: "Nǐmen yǒu shénme cài?"
      meaning: "What dishes do you have?"
    - chinese: "我们有北京烤鸭、面条和米饭。"
      pinyin: "Wǒmen yǒu Běijīng kǎoyā, miàntiáo hé mǐfàn."
      meaning: "We have Peking duck, noodles, and rice."
    - chinese: "我想吃北京烤鸭。一份多少钱？"
      pinyin: "Wǒ xiǎng chī Běijīng kǎoyā. Yí fèn duōshǎo qián?"
      meaning: "I want to eat Peking duck. How much is one serving?"
    - chinese: "一份烤鸭120块。要米饭吗？"
      pinyin: "Yí fèn kǎoyā yìbǎi èrshí kuài. Yào mǐfàn ma?"
      meaning: "One serving of duck is 120 yuan. Do you want rice?"
    - chinese: "要一碗米饭。谢谢！"
      pinyin: "Yào yì wǎn mǐfàn. Xièxie!"
      meaning: "Yes, one bowl of rice. Thank you!"