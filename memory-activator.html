<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Activator</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MD5 Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
    <!-- YAML Parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <!-- Shared Helpers -->
    <script src="./utils.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .playlist-scroll { scroll-behavior: smooth; }
        .range-thumb::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #3b82f6; border-radius: 50%; cursor: pointer; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        :root {
            --bg: linear-gradient(135deg, #f6efe5, #efe3d2);
            --panel: #fffaf2;
            --panel-2: #f4e9d8;
            --text: #2f2620;
            --muted: #7a6b5b;
            --border: #e6d5c4;
            --accent: #c25b2d;
            --accent-contrast: #fff6ed;
            --accent-soft: #f6d2bd;
            --chip: #f0e0cf;
            --chip-text: #7a5a3c;
            --shadow: 0 20px 60px rgba(77, 58, 40, 0.18);
        }
        [data-theme="paper"] {
            --bg: linear-gradient(135deg, #f6efe5, #efe3d2);
            --panel: #fffaf2;
            --panel-2: #f4e9d8;
            --text: #2f2620;
            --muted: #7a6b5b;
            --border: #e6d5c4;
            --accent: #c25b2d;
            --accent-contrast: #fff6ed;
            --accent-soft: #f6d2bd;
            --chip: #f0e0cf;
            --chip-text: #7a5a3c;
            --shadow: 0 20px 60px rgba(77, 58, 40, 0.18);
        }
        [data-theme="ink"] {
            --bg: linear-gradient(135deg, #f5f7f2, #dde7e2);
            --panel: #f9fbf8;
            --panel-2: #eef3f0;
            --text: #243336;
            --muted: #5b6b6f;
            --border: #d3ded8;
            --accent: #2d4f5d;
            --accent-contrast: #eef8fb;
            --accent-soft: #d8e5e2;
            --chip: #e5efea;
            --chip-text: #3e575f;
            --shadow: 0 20px 60px rgba(36, 51, 54, 0.12);
        }
        [data-theme="studio"] {
            --bg: linear-gradient(135deg, #f7f5f2, #e9eef1);
            --panel: #ffffff;
            --panel-2: #f3f5f7;
            --text: #1f2937;
            --muted: #5b6775;
            --border: #e2e8f0;
            --accent: #111827;
            --accent-contrast: #fef3c7;
            --accent-soft: #ffe5d5;
            --chip: #eef2f6;
            --chip-text: #2c3a4a;
            --shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
        }
        body { background: var(--bg); color: var(--text); }
        .theme-shell { background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .theme-border { border-color: var(--border) !important; }
        .theme-card { background: var(--panel-2) !important; }
        .theme-muted { color: var(--muted) !important; }
        .theme-chip { background: var(--chip); color: var(--chip-text); border: 1px solid var(--border); }
        .theme-button-primary { background: var(--accent); color: var(--accent-contrast); }
        .theme-button-primary:hover { filter: brightness(0.95); }
        .theme-play { background: var(--accent); color: var(--accent-contrast); }
        .theme-play.is-playing { background: var(--accent-soft); color: var(--accent); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---
        const Icons = {
            Play: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Pause: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>,
            SkipBack: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>,
            SkipForward: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>,
            Mic: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>,
            FileAudio: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19c0-1.7-1.3-3-3-3c-1.7 0-3 1.3-3 3c0 1.7 1.3 3 3 3c1.7 0 3-1.3 3-3Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/></svg>,
            Wifi: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>,
            Refresh: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        };

        // --- THEMES ---
        const THEME_STORAGE_KEY = 'appTheme';
        const THEMES = [
            { id: 'paper', name: 'Paper & Lantern' },
            { id: 'ink', name: 'Calm Ink Wash' },
            { id: 'studio', name: 'Modern Studio' }
        ];

        // --- KEYBOARD SHORTCUTS ---
        const SHORTCUT_STORAGE_KEY = 'keyboardShortcutsMemoryActivator';
        const DEFAULT_SHORTCUTS = {
            PLAY_PAUSE: 'SPACE',
            PREV_PHRASE: 'A,LEFT',
            NEXT_PHRASE: 'D,RIGHT',
            SPEED_UP: 'W,UP',
            SPEED_DOWN: 'S,DOWN',
            PAUSE_DOWN: 'Q',
            PAUSE_UP: 'E',
            TOGGLE_CN: 'CTRL+ALT+C',
            TOGGLE_PY: 'CTRL+ALT+Z',
            TOGGLE_EN: 'CTRL+ALT+X',
            HELP: '?',
            CLOSE: 'ESC'
        };
        const SHORTCUT_ACTIONS = [
            { id: 'PLAY_PAUSE', label: 'Play/Pause' },
            { id: 'PREV_PHRASE', label: 'Prev Phrase' },
            { id: 'NEXT_PHRASE', label: 'Next Phrase' },
            { id: 'SPEED_UP', label: 'Speed +' },
            { id: 'SPEED_DOWN', label: 'Speed -' },
            { id: 'PAUSE_DOWN', label: 'Pause -' },
            { id: 'PAUSE_UP', label: 'Pause +' },
            { id: 'TOGGLE_CN', label: 'Toggle Chinese' },
            { id: 'TOGGLE_PY', label: 'Toggle Pinyin' },
            { id: 'TOGGLE_EN', label: 'Toggle English' },
            { id: 'HELP', label: 'Show Shortcuts' },
            { id: 'CLOSE', label: 'Close Modal' }
        ];
        const normalizeCombo = (combo) => (combo || '').replace(/\s+/g, '').toUpperCase();
        const normalizeList = (value) => normalizeCombo(value).split(',').map((v) => v.trim()).filter(Boolean);
        const loadShortcuts = () => {
            try {
                const saved = JSON.parse(localStorage.getItem(SHORTCUT_STORAGE_KEY) || '{}');
                const merged = { ...DEFAULT_SHORTCUTS, ...saved };
                Object.keys(merged).forEach((k) => { merged[k] = normalizeCombo(merged[k]); });
                return merged;
            } catch {
                return { ...DEFAULT_SHORTCUTS };
            }
        };
        const getComboFromEvent = (e) => {
            let key = e.key;
            if (!key) return '';
            if (key === ' ') key = 'SPACE';
            if (key === 'Escape') key = 'ESC';
            if (key === 'ArrowLeft') key = 'LEFT';
            if (key === 'ArrowRight') key = 'RIGHT';
            if (key === 'ArrowUp') key = 'UP';
            if (key === 'ArrowDown') key = 'DOWN';
            const isSingleChar = key.length === 1;
            const hasModifier = e.ctrlKey || e.altKey || e.metaKey;
            if (isSingleChar && !hasModifier) {
                return normalizeCombo(key === 'SPACE' ? 'SPACE' : key.toUpperCase());
            }
            const parts = [];
            if (e.ctrlKey) parts.push('CTRL');
            if (e.altKey) parts.push('ALT');
            if (e.metaKey) parts.push('META');
            if (e.shiftKey) parts.push('SHIFT');
            parts.push(key.toUpperCase());
            return normalizeCombo(parts.join('+'));
        };
        const getActionForCombo = (shortcuts, combo) => {
            const normalized = normalizeCombo(combo);
            const entry = Object.entries(shortcuts).find(([, value]) => normalizeList(value).includes(normalized));
            return entry ? entry[0] : null;
        };

        const Player = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [fileLoaded, setFileLoaded] = useState(false);

            const [activeCatIndex, setActiveCatIndex] = useState(0);
            const [activePhraseIndex, setActivePhraseIndex] = useState(0);

            // Playback State
            const [status, setStatus] = useState('IDLE');
            const [isPlaying, setIsPlaying] = useState(false);
            const [audioSource, setAudioSource] = useState('');
            const [speed, setSpeed] = useState(1.0);
            const [pauseTime, setPauseTime] = useState(1.5);
            const [loops, setLoops] = useState(3);
            const [loopCount, setLoopCount] = useState(1);

            // Visibility
            const [showCn, setShowCn] = useState(true);
            const [showPy, setShowPy] = useState(true);
            const [showEn, setShowEn] = useState(true);
            const [showHelpModal, setShowHelpModal] = useState(false);
            const [isEditingShortcuts, setIsEditingShortcuts] = useState(false);
            const [shortcuts, setShortcuts] = useState(() => loadShortcuts());
            const [theme, setTheme] = useState(() => localStorage.getItem(THEME_STORAGE_KEY) || 'paper');

            const timerRef = useRef(null);
            const audioRef = useRef(new Audio());
            const stateRef = useRef({ activePhraseIndex, activeCatIndex, loopCount, loops, pauseTime, isPlaying, speed, data });

            // Sync Ref
            useEffect(() => {
                stateRef.current = { activePhraseIndex, activeCatIndex, loopCount, loops, pauseTime, isPlaying, speed, data };
                if(audioRef.current) audioRef.current.playbackRate = speed;
            }, [activePhraseIndex, activeCatIndex, loopCount, loops, pauseTime, isPlaying, speed, data]);

            useEffect(() => {
                localStorage.setItem(SHORTCUT_STORAGE_KEY, JSON.stringify(shortcuts));
            }, [shortcuts]);

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem(THEME_STORAGE_KEY, theme);
            }, [theme]);

            // Add keyboard event listener
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    const combo = getComboFromEvent(e);
                    if (!combo) return;
                    const action = getActionForCombo(shortcuts, combo);
                    if (!action) return;
                    e.preventDefault();
                    switch(action) {
                        case 'PLAY_PAUSE': togglePlay(); break;
                        case 'PREV_PHRASE': prevPhrase(); break;
                        case 'NEXT_PHRASE': nextPhrase(); break;
                        case 'SPEED_UP': document.querySelector('.speed-increase-btn')?.click(); break;
                        case 'SPEED_DOWN': document.querySelector('.speed-decrease-btn')?.click(); break;
                        case 'PAUSE_DOWN': document.querySelector('.pause-decrease-btn')?.click(); break;
                        case 'PAUSE_UP': document.querySelector('.pause-increase-btn')?.click(); break;
                        case 'TOGGLE_CN': setShowCn(v => !v); break;
                        case 'TOGGLE_PY': setShowPy(v => !v); break;
                        case 'TOGGLE_EN': setShowEn(v => !v); break;
                        case 'HELP': setShowHelpModal(true); break;
                        case 'CLOSE': setShowHelpModal(false); break;
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [speed, pauseTime, isPlaying, shortcuts]);

            // --- LOAD YAML from uploaded file ---
            const loadYamlFromFile = async (file) => {
                setLoading(true);
                setError(null);
                try {
                    const text = await file.text();
                    const parsed = jsyaml.load(text);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        setData(parsed);
                        setActiveCatIndex(0);
                        setActivePhraseIndex(0);
                        setFileLoaded(true);
                    } else {
                        throw new Error("YAML format is incorrect or empty");
                    }
                } catch (e) {
                    setError(e.message);
                } finally {
                    setLoading(false);
                }
            };

            // Handle new YAML file upload and merge with existing data
            const handleNewYamlFile = async (e) => {
                const file = e.target.files[0];
                if (file && (file.name.endsWith('.yaml') || file.name.endsWith('.yml'))) {
                    setLoading(true);
                    try {
                        const text = await file.text();
                        const parsed = jsyaml.load(text);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            // Merge new data with existing data
                            const mergedData = [...data, ...parsed];
                            setData(mergedData);
                            setActiveCatIndex(mergedData.length - 1); // Switch to the first newly added category
                            setActivePhraseIndex(0);
                        } else {
                            throw new Error("YAML format is incorrect or empty");
                        }
                    } catch (e) {
                        setError(e.message);
                    } finally {
                        setLoading(false);
                    }
                } else {
                    setError("Please select a valid .yaml or .yml file");
                }
            };

            // Handle initial file input
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file && (file.name.endsWith('.yaml') || file.name.endsWith('.yml'))) {
                    loadYamlFromFile(file);
                } else {
                    setError("Please select a valid .yaml or .yml file");
                }
            };

            // --- HELPERS ---
            const getCurrentPhrase = () => {
                if (!data[stateRef.current.activeCatIndex]) return null;
                const phrase = data[stateRef.current.activeCatIndex].phrases[stateRef.current.activePhraseIndex];
                // Add category to the phrase object for path construction
                if (phrase) {
                    phrase.category = data[stateRef.current.activeCatIndex].category;
                }
                return phrase;
            };

            const getPhrasesInCat = () => {
                if (!data[activeCatIndex]) return [];
                return data[activeCatIndex].phrases;
            };

            // --- AUDIO ENGINE ---
            const playAudio = async (text, lang, onEnd) => {
                const audio = audioRef.current;

                // Get current category to construct proper path
                const currentPhrase = getCurrentPhrase();
                const categoryName = currentPhrase ? currentPhrase.category || 'default' : 'default';
                // Normalize category name to be filesystem-friendly (same as in Python script)
                const safeCategory = toSafeCategory(categoryName);

                // 1. Try Local File in category subfolder
                const filename = `audio/${safeCategory}/audio_${md5(text)}.mp3`;

                // Helper to try play
                const tryPlay = (src) => new Promise((resolve, reject) => {
                    audio.src = src;
                    audio.playbackRate = stateRef.current.speed;
                    audio.onended = () => resolve();
                    audio.onerror = (e) => reject(e);
                    audio.play().catch(reject);
                });

                try {
                    setAudioSource('LOCAL');
                    await tryPlay(filename);
                    onEnd();
                } catch (e) {
                    console.log("Local audio failed, trying fallback...", e);
                    setAudioSource('SYSTEM');
                    // Fallback to System TTS
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = lang; // Set language based on parameter
                    u.rate = stateRef.current.speed;
                    u.onend = onEnd;
                    u.onerror = onEnd; // proceed anyway
                    window.speechSynthesis.speak(u);
                }
            };

            // Updated sequence: EN Audio -> Pause -> CH Audio -> Pause
            const playSequence = () => {
                setStatus('PLAYING_EN');
                const phrase = getCurrentPhrase();
                if(!phrase) return stop();

                // Play English audio first
                playAudio(phrase.meaning, "en-US", () => {
                    if (!stateRef.current.isPlaying) return;
                    setStatus('WAITING_RECALL');
                    // Wait for pause duration to allow user to recall
                    timerRef.current = setTimeout(() => {
                        if (!stateRef.current.isPlaying) return;
                        setStatus('PLAYING_CH');
                        // Then play Chinese audio for verification
                        playAudio(phrase.chinese, "zh-CN", () => {
                            if (!stateRef.current.isPlaying) return;
                            setStatus('WAITING_NEXT');
                            // Final pause before next action
                            timerRef.current = setTimeout(handleGapEnd, stateRef.current.pauseTime * 1000);
                        });
                    }, stateRef.current.pauseTime * 1000);
                });
            };

            const handleAudioEnd = () => {
                if (!stateRef.current.isPlaying) return;
                setStatus('WAITING');
                timerRef.current = setTimeout(handleGapEnd, stateRef.current.pauseTime * 1000);
            };

            const handleGapEnd = () => {
                if (!stateRef.current.isPlaying) return;
                const { loopCount, loops, activePhraseIndex, activeCatIndex, data } = stateRef.current;
                const currentCat = data[activeCatIndex];

                if (loopCount < loops) {
                    setLoopCount(prev => prev + 1);
                    playSequence();
                } else {
                    // Next Phrase
                    if (activePhraseIndex < currentCat.phrases.length - 1) {
                        nextPhrase();
                    } else {
                        stop(); // End of category
                    }
                }
            };

            const nextPhrase = () => {
                window.speechSynthesis.cancel();
                if(audioRef.current) audioRef.current.pause();
                clearTimeout(timerRef.current);

                const currentCat = data[stateRef.current.activeCatIndex];
                const nextIdx = stateRef.current.activePhraseIndex + 1;

                if (nextIdx < currentCat.phrases.length) {
                    setActivePhraseIndex(nextIdx);
                    setLoopCount(1);
                    stateRef.current.activePhraseIndex = nextIdx;
                    stateRef.current.loopCount = 1;
                    if (stateRef.current.isPlaying) setTimeout(playSequence, 50);
                }
            };

            const prevPhrase = () => {
                const prev = Math.max(0, activePhraseIndex - 1);
                setActivePhraseIndex(prev);
                setLoopCount(1);
                stop();
            };

            const togglePlay = () => {
                if (isPlaying) stop();
                else {
                    setIsPlaying(true);
                    stateRef.current.isPlaying = true;
                    playSequence();
                }
            };

            const stop = () => {
                setIsPlaying(false);
                setStatus('IDLE');
                window.speechSynthesis.cancel();
                if(audioRef.current) audioRef.current.pause();
                clearTimeout(timerRef.current);
            };

            const selectPhrase = (idx) => {
                stop();
                setActivePhraseIndex(idx);
                setLoopCount(1);
            };

            // Scroll Helper
            const listRef = useRef(null);
            useEffect(() => {
                if(listRef.current && listRef.current.children[activePhraseIndex]) {
                    listRef.current.children[activePhraseIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [activePhraseIndex]);


            if (error) return (
                <div className="h-screen flex flex-col items-center justify-center p-8 text-center gap-4">
                    <h2 className="text-xl font-bold text-red-600">Error Loading Data</h2>
                    <p className="max-w-md text-slate-600">{error}</p>
                    <button onClick={() => window.location.reload()} className="px-4 py-2 rounded theme-button-primary"><Icons.Refresh/> Retry</button>
                </div>
            );

            if (!fileLoaded) return (
                <div className="h-screen flex flex-col items-center justify-center p-8 text-center gap-6">
                    <h1 className="text-2xl font-bold text-slate-800">Memory Activator</h1>
                    <div className="max-w-md">
                        <p className="mb-4 text-slate-600">Upload your YAML file to begin</p>
                        <label className="block">
                            <input
                                type="file"
                                accept=".yaml,.yml"
                                onChange={handleFileChange}
                                className="hidden"
                            />
                            <div className="px-6 py-4 rounded-lg font-medium cursor-pointer inline-block transition-colors theme-button-primary">
                                Select YAML File
                            </div>
                        </label>
                        <p className="mt-4 text-sm text-slate-500">The app will use pre-generated audio files from the 'audio' folder</p>
                    </div>
                </div>
            );

            const phrases = getPhrasesInCat();
            const activePhrase = phrases[activePhraseIndex] || {};

            return (
                <div className="flex flex-col h-screen max-w-xl mx-auto theme-shell relative">
                    {/* Header */}
                    <div className="flex flex-col border-b theme-border z-20">
                        <div className="flex justify-between items-center p-4 pb-2">
                            <h1 className="font-bold text-xl">Memory Activator</h1>
                            <div className="flex items-center gap-2">
                                {status === 'PLAYING_EN' && <span className="text-xs text-green-600 font-bold animate-pulse">EN PLAYING</span>}
                                {status === 'WAITING_RECALL' && <span className="text-xs text-amber-600 font-bold animate-pulse">RECALL TIME</span>}
                                {status === 'PLAYING_CH' && <span className="text-xs text-green-600 font-bold animate-pulse">CH PLAYING</span>}
                                {status === 'WAITING_NEXT' && <span className="text-xs text-purple-600 font-bold animate-pulse">PAUSE</span>}
                                <select value={theme} onChange={(e) => setTheme(e.target.value)} className="text-xs px-2 py-1 rounded-full font-bold theme-chip">
                                    {THEMES.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>
                                <a href="lesson-creator.html" className="text-xs px-3 py-1 rounded-full font-bold theme-chip">Lesson Creator</a>
                                <button onClick={() => setShowHelpModal(true)} className="text-xs px-2 py-1 rounded-full font-bold theme-chip">?</button>
                            </div>
                        </div>
                        {/* Category Selector */}
                        <div className="px-4 pb-4 flex items-center gap-2">
                            <select
                                className="flex-1 p-2 rounded-lg font-medium outline-none theme-chip"
                                value={activeCatIndex}
                                onChange={(e) => {
                                    stop();
                                    setActiveCatIndex(Number(e.target.value));
                                    setActivePhraseIndex(0);
                                }}
                            >
                                {data.map((cat, idx) => (
                                    <option key={idx} value={idx}>{cat.category} ({cat.phrases.length})</option>
                                ))}
                            </select>
                            <label className="cursor-pointer p-2 rounded-lg font-medium theme-button-primary">
                                +
                                <input
                                    type="file"
                                    accept=".yaml,.yml"
                                    onChange={(e) => handleNewYamlFile(e)}
                                    className="hidden"
                                />
                            </label>
                        </div>
                    </div>

                    {/* Active Card */}
                    <div className="p-8 flex flex-col items-center justify-center min-h-[240px] text-center gap-3 relative overflow-hidden theme-card">
                         <div className={`transition-all duration-500 ${showCn ? 'opacity-100 blur-0' : 'opacity-0 blur-md'}`}>
                            <h2 className="text-3xl font-bold text-slate-800">{activePhrase.chinese}</h2>
                         </div>
                         <div className={`transition-all duration-500 ${showPy ? 'opacity-100' : 'opacity-0'}`}>
                            <p className="text-xl text-blue-600 font-medium">{activePhrase.pinyin}</p>
                         </div>
                         <div className={`transition-all duration-500 ${showEn ? 'opacity-100' : 'opacity-0'}`}>
                            <p className="text-slate-500">{activePhrase.meaning}</p>
                         </div>

                         <div className="absolute top-4 right-4">
                            {status === 'PLAYING_EN' && <span className="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded-full">EN LOOP {loopCount}/{loops}</span>}
                            {status === 'WAITING_RECALL' && <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded-full">RECALL NOW</span>}
                            {status === 'PLAYING_CH' && <span className="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded-full">CH LOOP {loopCount}/{loops}</span>}
                            {status === 'WAITING_NEXT' && <span className="bg-purple-100 text-purple-700 text-xs font-bold px-2 py-1 rounded-full">WAIT</span>}
                         </div>
                    </div>

                    {/* Controls */}
                    <div className="p-4 border-b space-y-4 z-10 shadow-sm theme-card">
                        <div className="grid grid-cols-3 gap-4 text-xs font-bold text-slate-500 text-center">
                            <div>
                                <label className="block mb-1">LOOPS: <span className="text-blue-600 text-lg">{loops}</span></label>
                                <div className="flex items-center gap-1">
                                    <button onClick={()=>setLoops(Math.max(1,loops-1))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200">-</button>
                                    <div className="flex-1 h-1 bg-slate-100 rounded overflow-hidden"><div className="bg-blue-500 h-full" style={{width: (loops/10)*100+'%'}}></div></div>
                                    <button onClick={()=>setLoops(Math.min(10,loops+1))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200">+</button>
                                </div>
                            </div>
                            <div>
                                <label className="block mb-1">SPEED: <span className="text-blue-600 text-lg">{speed}x</span></label>
                                <div className="flex items-center gap-1">
                                    <button onClick={()=>setSpeed(Math.max(0.5, +(speed-0.1).toFixed(1)))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200 speed-decrease-btn">-</button>
                                    <div className="flex-1 h-1 bg-slate-100 rounded overflow-hidden"><div className="bg-indigo-500 h-full" style={{width: (speed/2)*100+'%'}}></div></div>
                                    <button onClick={()=>setSpeed(Math.min(2.0, +(speed+0.1).toFixed(1)))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200 speed-increase-btn">+</button>
                                </div>
                            </div>
                            <div>
                                <label className="block mb-1">PAUSE: <span className="text-blue-600 text-lg">{pauseTime}s</span></label>
                                <div className="flex items-center gap-1">
                                    <button onClick={()=>setPauseTime(Math.max(0, +(pauseTime-0.5).toFixed(1)))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200 pause-decrease-btn">-</button>
                                    <div className="flex-1 h-1 bg-slate-100 rounded overflow-hidden"><div className="bg-teal-500 h-full" style={{width: (pauseTime/10)*100+'%'}}></div></div>
                                    <button onClick={()=>setPauseTime(Math.min(10, +(pauseTime+0.5).toFixed(1)))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200 pause-increase-btn">+</button>
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-center gap-6 py-2 border-t border-slate-100 mt-2">
                             {[{l:'汉',v:showCn,s:setShowCn,c:'blue'},{l:'PY',v:showPy,s:setShowPy,c:'indigo'},{l:'EN',v:showEn,s:setShowEn,c:'teal'}].map((t,i) => (
                                 <button key={i} onClick={()=>t.s(!t.v)} className={`flex items-center gap-2 text-sm font-bold ${t.v?`text-${t.c}-600`:'text-slate-300'}`}>
                                    <div className={`w-4 h-4 rounded-full border-2 ${t.v?`bg-${t.c}-600 border-${t.c}-600`:'border-slate-300'}`}></div>{t.l}
                                 </button>
                             ))}
                        </div>

                        <div className="flex justify-center items-center gap-8 pt-2">
                            <button onClick={prevPhrase} className="text-slate-400 hover:text-slate-600"><Icons.SkipBack /></button>
                            <button onClick={togglePlay} className={`w-14 h-14 rounded-full flex items-center justify-center shadow-lg transform active:scale-95 transition-all theme-play ${isPlaying ? 'is-playing' : ''}`}>
                                {isPlaying ? <Icons.Pause /> : <Icons.Play style={{marginLeft:4}} />}
                            </button>
                            <button onClick={nextPhrase} className="text-slate-400 hover:text-slate-600"><Icons.SkipForward /></button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto playlist-scroll" ref={listRef}>
                        {phrases.map((phrase, idx) => (
                            <div key={idx} onClick={() => selectPhrase(idx)} className={`p-4 border-b flex items-center gap-4 cursor-pointer hover:bg-slate-50 ${idx === activePhraseIndex ? 'bg-blue-50 border-l-4 border-l-blue-500' : 'border-transparent'}`}>
                                <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${idx === activePhraseIndex ? 'bg-blue-200 text-blue-700' : 'bg-slate-100 text-slate-400'}`}>{idx + 1}</span>
                                <div className="flex-1">
                                    <p className={`font-medium ${idx === activePhraseIndex ? 'text-blue-900' : 'text-slate-700'}`}>{phrase.chinese}</p>
                                    <p className="text-xs text-slate-400">{phrase.pinyin}</p>
                                </div>
                                {idx === activePhraseIndex && isPlaying && <Icons.Mic className="w-4 h-4 text-blue-500 animate-bounce" />}
                            </div>
                        ))}
                    </div>

                    {showHelpModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg max-w-lg w-full p-6 relative shadow-xl theme-shell">
                                <button onClick={() => setShowHelpModal(false)} className="absolute top-3 right-3 text-gray-500 hover:text-gray-700">✕</button>
                                <div className="flex items-center justify-between mb-3">
                                    <h2 className="text-xl font-bold">Keyboard Shortcuts</h2>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => setIsEditingShortcuts(v => !v)} className="text-xs px-3 py-1 rounded-full font-bold border border-slate-200 bg-slate-100 hover:bg-slate-200">{isEditingShortcuts ? 'Done' : 'Edit'}</button>
                                        <button onClick={() => setShortcuts({ ...DEFAULT_SHORTCUTS })} className="text-xs px-3 py-1 rounded-full font-bold border border-slate-200 bg-white hover:bg-slate-100">Reset</button>
                                    </div>
                                </div>
                                {isEditingShortcuts && <div className="text-xs text-slate-500 mb-3">Click a shortcut and press new keys. Backspace clears.</div>}
                                <div className="space-y-2 text-sm max-h-80 overflow-y-auto pr-1">
                                    {SHORTCUT_ACTIONS.map((action) => (
                                        <div key={action.id} className="flex justify-between items-center py-1 border-b">
                                            <span>{action.label}</span>
                                            {!isEditingShortcuts ? (
                                                <span className="font-mono text-slate-600">{shortcuts[action.id]}</span>
                                            ) : (
                                                <input
                                                    className="w-40 text-xs font-mono text-right border border-slate-200 rounded px-2 py-1 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-200"
                                                    value={shortcuts[action.id] || ''}
                                                    onChange={() => {}}
                                                    onKeyDown={(e) => {
                                                        e.preventDefault();
                                                        e.stopPropagation();
                                                        if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
                                                        if (e.key === 'Backspace' || e.key === 'Delete') {
                                                            setShortcuts(prev => ({ ...prev, [action.id]: '' }));
                                                            return;
                                                        }
                                                        const combo = getComboFromEvent(e);
                                                        if (!combo) return;
                                                        setShortcuts(prev => ({ ...prev, [action.id]: combo }));
                                                    }}
                                                />
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<Player />);
    </script>
</body>
</html>
