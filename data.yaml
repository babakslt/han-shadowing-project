- category: "Level 1"
  phrases:
    - chinese: "你好。"
      pinyin: "Nǐ hǎo."
      meaning: "Hello."
    - chinese: "谢谢。"
      pinyin: "Xièxie."
      meaning: "Thank you."
    - chinese: "对不起。"
      pinyin: "Duìbuqǐ."
      meaning: "Sorry."
    - chinese: "我叫Bob。"
      pinyin: "Wǒ jiào Bob."
      meaning: "My name is Bob."
    - chinese: "我是学生。"
      pinyin: "Wǒ shì xuéshēng."
      meaning: "I am a student."
    - chinese: "我会说一点中文。"
      pinyin: "Wǒ huì shuō yīdiǎn Zhōngwén."
      meaning: "I can speak a little Chinese."
    - chinese: "我不懂。"
      pinyin: "Wǒ bù dǒng."
      meaning: "I don’t understand."
    - chinese: "多少钱？"
      pinyin: "Duōshǎo qián?"
      meaning: "How much is it?"
    - chinese: "我在看书。"
      pinyin: "Wǒ zài kànshū."
      meaning: "I’m reading."
    - chinese: "再见！"
      pinyin: "Zàijiàn!"
      meaning: "Goodbye!"

- category: "Level 2"
  phrases:
    - chinese: "你叫什么名字？"
      pinyin: "Nǐ jiào shénme míngzì?"
      meaning: "What is your name?"
    - chinese: "你是哪国人？"
      pinyin: "Nǐ shì nǎ guó rén?"
      meaning: "What country are you from?"
    - chinese: "我会说英语和波斯语。"
      pinyin: "Wǒ huì shuō Yīngyǔ hé Bōsīyǔ."
      meaning: "I can speak English and Persian."
    - chinese: "我不太会说中文。"
      pinyin: "Wǒ bù tài huì shuō Zhōngwén."
      meaning: "I don't speak Chinese very well."
    - chinese: "这个多少钱？"
      pinyin: "Zhège duōshǎo qián?"
      meaning: "How much is this?"
    - chinese: "我要一杯咖啡。"
      pinyin: "Wǒ yào yībēi kāfēi."
      meaning: "I would like a cup of coffee."
    - chinese: "他在哪儿？"
      pinyin: "Tā zài nǎr?"
      meaning: "Where is he?"
    - chinese: "现在几点？"
      pinyin: "Xiànzài jǐ diǎn?"
      meaning: "What time is it?"
    - chinese: "我每天六点起床。"
      pinyin: "Wǒ měitiān liù diǎn qǐchuáng."
      meaning: "I get up at six o'clock every day."
    - chinese: "今天天气很好。"
      pinyin: "Jīntiān tiānqì hěn hǎo."
      meaning: "The weather is very good today."

- category: "Level 3"
  phrases:
    - chinese: "你吃饭了吗？"
      pinyin: "Nǐ chīfàn le ma?"
      meaning: "Have you eaten?"
    - chinese: "我饿了。"
      pinyin: "Wǒ è le."
      meaning: "I’m hungry."
    - chinese: "我想喝水。"
      pinyin: "Wǒ xiǎng hē shuǐ."
      meaning: "I want to drink water."
    - chinese: "厕所在哪儿？"
      pinyin: "Cèsuǒ zài nǎr?"
      meaning: "Where is the restroom?"
    - chinese: "我不认识他。"
      pinyin: "Wǒ bù rènshi tā."
      meaning: "I don’t know him."
    - chinese: "她很忙。"
      pinyin: "Tā hěn máng."
      meaning: "She is very busy."
    - chinese: "我们去公园吧。"
      pinyin: "Wǒmen qù gōngyuán ba."
      meaning: "Let’s go to the park."
    - chinese: "这本书很有意思。"
      pinyin: "Zhè běn shū hěn yǒuyìsi."
      meaning: "This book is very interesting."
    - chinese: "明天我有课。"
      pinyin: "Míngtiān wǒ yǒu kè."
      meaning: "I have class tomorrow."
    - chinese: "你喜欢喝茶吗？"
      pinyin: "Nǐ xǐhuān hē chá ma?"
      meaning: "Do you like drinking tea?"

- category: "Level 4"
  phrases:
    - chinese: "我可以问一个问题吗？"
      pinyin: "Wǒ kěyǐ wèn yí gè wèntí ma?"
      meaning: "Can I ask a question?"
    - chinese: "请再说一遍。"
      pinyin: "Qǐng zài shuō yí biàn."
      meaning: "Please say it again."
    - chinese: "我不知道。"
      pinyin: "Wǒ bù zhīdào."
      meaning: "I don’t know."
    - chinese: "他不在家。"
      pinyin: "Tā bú zài jiā."
      meaning: "He’s not at home."
    - chinese: "今天星期几？"
      pinyin: "Jīntiān xīngqí jǐ?"
      meaning: "What day is it today?"
    - chinese: "我周末经常跑步。"
      pinyin: "Wǒ zhōumò jīngcháng pǎobù."
      meaning: "I often run on weekends."
    - chinese: "你有兄弟姐妹吗？"
      pinyin: "Nǐ yǒu xiōngdì jiěmèi ma?"
      meaning: "Do you have siblings?"
    - chinese: "这个字怎么读？"
      pinyin: "Zhège zì zěnme dú?"
      meaning: "How do you read this character?"
    - chinese: "我不喜欢下雨天。"
      pinyin: "Wǒ bù xǐhuān xiàyǔ tiān."
      meaning: "I don’t like rainy days."
    - chinese: "我们几点见面？"
      pinyin: "Wǒmen jǐ diǎn jiànmiàn?"
      meaning: "What time shall we meet?"

- category: "Level 5"
  phrases:
    - chinese: "你能帮我吗？"
      pinyin: "Nǐ néng bāng wǒ ma?"
      meaning: "Can you help me?"
    - chinese: "我学中文已经三个月了。"
      pinyin: "Wǒ xué Zhōngwén yǐjīng sān gè yuè le."
      meaning: "I’ve been learning Chinese for three months."
    - chinese: "昨天我去了超市。"
      pinyin: "Zuótiān wǒ qù le chāoshì."
      meaning: "I went to the supermarket yesterday."
    - chinese: "他比我高。"
      pinyin: "Tā bǐ wǒ gāo."
      meaning: "He is taller than me."
    - chinese: "这双鞋太贵了。"
      pinyin: "Zhè shuāng xié tài guì le."
      meaning: "These shoes are too expensive."
    - chinese: "你想吃什么？"
      pinyin: "Nǐ xiǎng chī shénme?"
      meaning: "What do you want to eat?"
    - chinese: "我还没吃饭。"
      pinyin: "Wǒ hái méi chīfàn."
      meaning: "I haven’t eaten yet."
    - chinese: "图书馆在左边。"
      pinyin: "Túshūguǎn zài zuǒbian."
      meaning: "The library is on the left."
    - chinese: "她中文说得很好。"
      pinyin: "Tā Zhōngwén shuō de hěn hǎo."
      meaning: "She speaks Chinese very well."
    - chinese: "我们明天见。"
      pinyin: "Wǒmen míngtiān jiàn."
      meaning: "See you tomorrow."

- category: "Level 6"
  phrases:
    - chinese: "如果你有时间，我们可以一起学习。"
      pinyin: "Rúguǒ nǐ yǒu shíjiān, wǒmen kěyǐ yìqǐ xuéxí."
      meaning: "If you have time, we can study together."
    - chinese: "我觉得这个电影很好看。"
      pinyin: "Wǒ juéde zhège diànyǐng hěn hǎokàn."
      meaning: "I think this movie is very good."
    - chinese: "他每天骑自行车上班。"
      pinyin: "Tā měitiān qí zìxíngchē shàngbān."
      meaning: "He rides a bike to work every day."
    - chinese: "请给我一张票。"
      pinyin: "Qǐng gěi wǒ yì zhāng piào."
      meaning: "Please give me one ticket."
    - chinese: "我打算明年去中国。"
      pinyin: "Wǒ dǎsuàn míngnián qù Zhōngguó."
      meaning: "I plan to go to China next year."
    - chinese: "这个周末你有什么安排？"
      pinyin: "Zhège zhōumò nǐ yǒu shénme ānpái?"
      meaning: "What are your plans for this weekend?"
    - chinese: "我不小心把杯子打碎了。"
      pinyin: "Wǒ bù xiǎoxīn bǎ bēizi dǎ suì le."
      meaning: "I accidentally broke the cup."
    - chinese: "你能说慢一点吗？"
      pinyin: "Nǐ néng shuō màn yìdiǎn ma?"
      meaning: "Can you speak a little slower?"
    - chinese: "我最喜欢的颜色是绿色。"
      pinyin: "Wǒ zuì xǐhuān de yánsè shì lǜsè."
      meaning: "My favorite color is green."
    - chinese: "天气太热了，我不想出门。"
      pinyin: "Tiānqì tài rè le, wǒ bù xiǎng chūmén."
      meaning: "It’s too hot; I don’t want to go out."

- category: "Level 7"
  phrases:
    - chinese: "虽然我很累，但我还是要学习。"
      pinyin: "Suīrán wǒ hěn lèi, dàn wǒ hái shì yào xuéxí."
      meaning: "Although I’m very tired, I still need to study."
    - chinese: "你为什么学中文？"
      pinyin: "Nǐ wèishéme xué Zhōngwén?"
      meaning: "Why are you learning Chinese?"
    - chinese: "我通常晚上看书。"
      pinyin: "Wǒ tōngcháng wǎnshang kànshū."
      meaning: "I usually read books in the evening."
    - chinese: "这家餐厅的菜很好吃。"
      pinyin: "Zhè jiā cāntīng de cài hěn hǎochī."
      meaning: "The food at this restaurant is delicious."
    - chinese: "他从来不迟到。"
      pinyin: "Tā cónglái bù chídào."
      meaning: "He is never late."
    - chinese: "我忘了带钥匙。"
      pinyin: "Wǒ wàng le dài yàoshi."
      meaning: "I forgot to bring my keys."
    - chinese: "你看起来很高兴。"
      pinyin: "Nǐ kàn qǐlái hěn gāoxìng."
      meaning: "You look very happy."
    - chinese: "我们一起去吧！"
      pinyin: "Wǒmen yìqǐ qù ba!"
      meaning: "Let’s go together!"
    - chinese: "这个作业很难。"
      pinyin: "Zhège zuòyè hěn nán."
      meaning: "This homework is very difficult."
    - chinese: "我需要休息一下。"
      pinyin: "Wǒ xūyào xiūxi yíxià."
      meaning: "I need to rest a bit."

- category: "Level 8"
  phrases:
    - chinese: "自从我开始跑步，身体变好了。"
      pinyin: "Zìcóng wǒ kāishǐ pǎobù, shēntǐ biàn hǎo le."
      meaning: "Since I started running, my health has improved."
    - chinese: "除非下雨，否则我每天都跑步。"
      pinyin: "Chúfēi xiàyǔ, fǒuzé wǒ měitiān dōu pǎobù."
      meaning: "Unless it rains, I run every day."
    - chinese: "你可以用我的电脑。"
      pinyin: "Nǐ kěyǐ yòng wǒ de diànnǎo."
      meaning: "You can use my computer."
    - chinese: "他比我大两岁。"
      pinyin: "Tā bǐ wǒ dà liǎng suì."
      meaning: "He is two years older than me."
    - chinese: "我觉得你应该多练习。"
      pinyin: "Wǒ juéde nǐ yīnggāi duō liànxí."
      meaning: "I think you should practice more."
    - chinese: "我已经做完作业了。"
      pinyin: "Wǒ yǐjīng zuò wán zuòyè le."
      meaning: "I’ve already finished my homework."
    - chinese: "她一边听音乐一边做饭。"
      pinyin: "Tā yìbiān tīng yīnyuè yìbiān zuòfàn."
      meaning: "She cooks while listening to music."
    - chinese: "对不起，我迟到了。"
      pinyin: "Duìbuqǐ, wǒ chídào le."
      meaning: "Sorry, I’m late."
    - chinese: "你最好早点睡觉。"
      pinyin: "Nǐ zuìhǎo zǎodiǎn shuìjiào."
      meaning: "You’d better go to bed early."
    - chinese: "这个问题很重要。"
      pinyin: "Zhège wèntí hěn zhòngyào."
      meaning: "This question is very important."

- category: "Level 9"
  phrases:
    - chinese: "不管多忙，我都会学习中文。"
      pinyin: "Bùguǎn duō máng, wǒ dōu huì xuéxí Zhōngwén."
      meaning: "No matter how busy I am, I will study Chinese."
    - chinese: "如果你有问题，可以问我。"
      pinyin: "Rúguǒ nǐ yǒu wèntí, kěyǐ wèn wǒ."
      meaning: "If you have questions, you can ask me."
    - chinese: "我希望能通过HSK 3考试。"
      pinyin: "Wǒ xīwàng néng tōngguò HSK 3 kǎoshì."
      meaning: "I hope I can pass the HSK 3 exam."
    - chinese: "他不仅聪明，而且很努力。"
      pinyin: "Tā bùjǐn cōngming, érqiě hěn nǔlì."
      meaning: "He is not only smart but also very hardworking."
    - chinese: "这件事让我很惊讶。"
      pinyin: "Zhè jiàn shì ràng wǒ hěn jīngyà."
      meaning: "This matter surprised me a lot."
    - chinese: "我打算每天学一小时中文。"
      pinyin: "Wǒ dǎsuàn měitiān xué yí xiǎoshí Zhōngwén."
      meaning: "I plan to study Chinese one hour every day."
    - chinese: "虽然下雨了，我们还是去了公园。"
      pinyin: "Suīrán xià yǔ le, wǒmen háishì qù le gōngyuán."
      meaning: "Although it rained, we still went to the park."
    - chinese: "你看起来有点累。"
      pinyin: "Nǐ kàn qǐlái yǒudiǎn lèi."
      meaning: "You look a bit tired."
    - chinese: "这是我第一次来中国。"
      pinyin: "Zhè shì wǒ dì yī cì lái Zhōngguó."
      meaning: "This is my first time coming to China."
    - chinese: "我希望很快能说流利的中文。"
      pinyin: "Wǒ xīwàng hěn kuài néng shuō liúlì de Zhōngwén."
      meaning: "I hope I can speak fluent Chinese soon."

- category: "Level 10"
  phrases:
    - chinese: "为了提高中文水平，我每天坚持练习。"
      pinyin: "Wèile tígāo Zhōngwén shuǐpíng, wǒ měitiān jiānchí liànxí."
      meaning: "To improve my Chinese, I practice every day."
    - chinese: "比起咖啡，我更喜欢茶。"
      pinyin: "Bǐqǐ kāfēi, wǒ gèng xǐhuān chá."
      meaning: "Compared to coffee, I prefer tea."
    - chinese: "如果你需要帮助，请随时告诉我。"
      pinyin: "Rúguǒ nǐ xūyào bāngzhù, qǐng suíshí gàosu wǒ."
      meaning: "If you need help, please let me know anytime."
    - chinese: "学习语言需要时间和耐心。"
      pinyin: "Xuéxí yǔyán xūyào shíjiān hé nàixīn."
      meaning: "Learning a language requires time and patience."
    - chinese: "我已经在中国住了三个月了。"
      pinyin: "Wǒ yǐjīng zài Zhōngguó zhù le sān gè yuè le."
      meaning: "I’ve already lived in China for three months."
    - chinese: "他说话的时候总是很认真。"
      pinyin: "Tā shuōhuà de shíhou zǒngshì hěn rènzhēn."
      meaning: "He’s always very serious when speaking."
    - chinese: "不管结果如何，我都会尽力。"
      pinyin: "Bùguǎn jiéguǒ rúhé, wǒ dōu huì jìnlì."
      meaning: "No matter the outcome, I’ll do my best."
    - chinese: "这本书对我很有帮助。"
      pinyin: "Zhè běn shū duì wǒ hěn yǒu bāngzhù."
      meaning: "This book is very helpful to me."
    - chinese: "我希望将来能在中国工作。"
      pinyin: "Wǒ xīwàng jiānglái néng zài Zhōngguó gōngzuò."
      meaning: "I hope to work in China in the future."
    - chinese: "谢谢你一直以来的支持。"
      pinyin: "Xièxie nǐ yìzhí yǐlái de zhīchí."
      meaning: "Thank you for your support all along."

- category: "Lesson 12"
  phrases:
    - chinese: "现在七点半。"
      pinyin: "Xiànzài qī diǎn bàn."
      meaning: "It’s half past seven now."
    - chinese: "我每天八点去学校。"
      pinyin: "Wǒ měitiān bā diǎn qù xuéxiào."
      meaning: "I go to school at eight every day."
    - chinese: "他早上六点起床。"
      pinyin: "Tā zǎoshang liù diǎn qǐchuáng."
      meaning: "He gets up at six in the morning."
    - chinese: "我们中午十二点吃午饭。"
      pinyin: "Wǒmen zhōngwǔ shí’èr diǎn chī wǔfàn."
      meaning: "We eat lunch at noon (12 o’clock)."
    - chinese: "晚上十点我睡觉。"
      pinyin: "Wǎnshang shí diǎn wǒ shuìjiào."
      meaning: "I go to bed at ten p.m."
    - chinese: "爸爸下午五点回家。"
      pinyin: "Bàba xiàwǔ wǔ diǎn huí jiā."
      meaning: "Dad comes home at five p.m."
    - chinese: "今天星期六。"
      pinyin: "Jīntiān xīngqíliù."
      meaning: "Today is Saturday."
    - chinese: "我周末不上班。"
      pinyin: "Wǒ zhōumò bù shàngbān."
      meaning: "I don’t work on weekends."
    - chinese: "现在你在做什么？"
      pinyin: "Xiànzài nǐ zài zuò shénme?"
      meaning: "What are you doing now?"
    - chinese: "我现在在看书。"
      pinyin: "Wǒ xiànzài zài kànshū."
      meaning: "I’m reading now."

- category: "Lesson 13"
  phrases:
    - chinese: "我在听音乐。"
      pinyin: "Wǒ zài tīng yīnyuè."
      meaning: "I’m listening to music."
    - chinese: "她在图书馆看书呢。"
      pinyin: "Tā zài túshūguǎn kànshū ne."
      meaning: "She’s reading in the library."
    - chinese: "他们在健身房跑步。"
      pinyin: "Tāmen zài jiànshēnfáng pǎobù."
      meaning: "They’re running at the gym."
    - chinese: "你在干什么？"
      pinyin: "Nǐ zài gàn shénme?"
      meaning: "What are you doing?"
    - chinese: "我在做饭呢。"
      pinyin: "Wǒ zài zuòfàn ne."
      meaning: "I’m cooking."
    - chinese: "猫在桌子上。"
      pinyin: "Māo zài zhuōzi shàng."
      meaning: "The cat is on the table."
    - chinese: "书在椅子下面。"
      pinyin: "Shū zài yǐzi xiàmian."
      meaning: "The book is under the chair."
    - chinese: "妈妈不在家。"
      pinyin: "Māma bú zài jiā."
      meaning: "Mom is not at home."
    - chinese: "他在打电话。"
      pinyin: "Tā zài dǎ diànhuà."
      meaning: "He’s making a phone call."
    - chinese: "我们在咖啡馆聊天呢。"
      pinyin: "Wǒmen zài kāfēiguǎn liáotiān ne."
      meaning: "We’re chatting at the café."

- category: "Lesson 14"
  phrases:
    - chinese: "桌子上有本书。"
      pinyin: "Zhuōzi shàng yǒu yì běn shū."
      meaning: "There is a book on the table."
    - chinese: "学校里有很多学生。"
      pinyin: "Xuéxiào lǐ yǒu hěn duō xuéshēng."
      meaning: "There are many students in the school."
    - chinese: "我家有三口人。"
      pinyin: "Wǒ jiā yǒu sān kǒu rén."
      meaning: "There are three people in my family."
    - chinese: "教室里没有老师。"
      pinyin: "Jiàoshì lǐ méiyǒu lǎoshī."
      meaning: "There is no teacher in the classroom."
    - chinese: "椅子下面有只猫。"
      pinyin: "Yǐzi xiàmian yǒu zhī māo."
      meaning: "There is a cat under the chair."
    - chinese: "公园里有花和树。"
      pinyin: "Gōngyuán lǐ yǒu huā hé shù."
      meaning: "There are flowers and trees in the park."
    - chinese: "你有中文书吗？"
      pinyin: "Nǐ yǒu Zhōngwén shū ma?"
      meaning: "Do you have a Chinese book?"
    - chinese: "我没有钢笔。"
      pinyin: "Wǒ méiyǒu gānbǐ."
      meaning: "I don’t have a pen."
    - chinese: "超市里有水果。"
      pinyin: "Chāoshì lǐ yǒu shuǐguǒ."
      meaning: "There is fruit in the supermarket."
    - chinese: "包里有钥匙吗？"
      pinyin: "Bāo lǐ yǒu yàoshi ma?"
      meaning: "Is there a key in the bag?"

- category: "Lesson 15"
  phrases:
    - chinese: "请坐。"
      pinyin: "Qǐng zuò."
      meaning: "Please sit down."
    - chinese: "请喝茶。"
      pinyin: "Qǐng hē chá."
      meaning: "Please drink tea."
    - chinese: "请写您的名字。"
      pinyin: "Qǐng xiě nín de míngzì."
      meaning: "Please write your name."
    - chinese: "今天的天气太好了！"
