<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarin Shadowing (YAML)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MD5 Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
    <!-- YAML Parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .playlist-scroll { scroll-behavior: smooth; }
        .range-thumb::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #3b82f6; border-radius: 50%; cursor: pointer; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- PROGRESS SERVICE ---
        const ProgressService = {
            // Initialize progress data if not exists
            init: () => {
                if (!localStorage.getItem('progressData')) {
                    localStorage.setItem('progressData', JSON.stringify({}));
                }
                if (!localStorage.getItem('bookmarks')) {
                    localStorage.setItem('bookmarks', JSON.stringify([]));
                }
            },
            
            // Get all progress data
            getProgressData: () => {
                return JSON.parse(localStorage.getItem('progressData') || '{}');
            },
            
            // Get bookmarks
            getBookmarks: () => {
                return JSON.parse(localStorage.getItem('bookmarks') || '[]');
            },
            
            // Save progress data
            saveProgressData: (data) => {
                localStorage.setItem('progressData', JSON.stringify(data));
            },
            
            // Save bookmarks
            saveBookmarks: (bookmarks) => {
                localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            },
            
            // Update category progress
            updateCategoryProgress: (categoryId) => {
                const progressData = ProgressService.getProgressData();
                const timestamp = new Date().toISOString();
                
                if (!progressData[categoryId]) {
                    progressData[categoryId] = {
                        times_practiced: 0,
                        last_practiced: null,
                        target_practices: 10  // Default target
                    };
                }
                
                progressData[categoryId].times_practiced += 1;
                progressData[categoryId].last_practiced = timestamp;
                
                ProgressService.saveProgressData(progressData);
                return progressData[categoryId];
            },
            
            // Get category progress
            getCategoryProgress: (categoryId) => {
                const progressData = ProgressService.getProgressData();
                return progressData[categoryId] || {
                    times_practiced: 0,
                    last_practiced: null,
                    target_practices: 10
                };
            },
            
            // Set target practices for a category
            setTargetPractices: (categoryId, target) => {
                const progressData = ProgressService.getProgressData();
                
                if (!progressData[categoryId]) {
                    progressData[categoryId] = {
                        times_practiced: 0,
                        last_practiced: null,
                        target_practices: target
                    };
                } else {
                    progressData[categoryId].target_practices = target;
                }
                
                ProgressService.saveProgressData(progressData);
            },
            
            // Toggle bookmark for a phrase
            toggleBookmark: (phrase) => {
                const bookmarks = ProgressService.getBookmarks();
                const phraseKey = `${phrase.category}__${phrase.chinese}__${phrase.pinyin}`;
                const existingIndex = bookmarks.findIndex(b => b.key === phraseKey);
                
                if (existingIndex >= 0) {
                    // Remove bookmark
                    bookmarks.splice(existingIndex, 1);
                } else {
                    // Add bookmark
                    bookmarks.push({
                        key: phraseKey,
                        phrase: phrase,
                        timestamp: new Date().toISOString()
                    });
                }
                
                ProgressService.saveBookmarks(bookmarks);
                return existingIndex < 0; // return true if added, false if removed
            },
            
            // Check if a phrase is bookmarked
            isBookmarked: (phrase) => {
                const bookmarks = ProgressService.getBookmarks();
                const phraseKey = `${phrase.category}__${phrase.chinese}__${phrase.pinyin}`;
                return bookmarks.some(b => b.key === phraseKey);
            }
        };

        // Initialize progress service
        ProgressService.init();

        // --- ICONS ---
        const Icons = {
            Play: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Pause: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>,
            SkipBack: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>,
            SkipForward: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>,
            Mic: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>,
            FileAudio: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19c0-1.7-1.3-3-3-3c-1.7 0-3 1.3-3 3c0 1.7 1.3 3 3 3c1.7 0 3-1.3 3-3Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/></svg>,
            Wifi: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>,
            Refresh: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        };

        const Player = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [fileLoaded, setFileLoaded] = useState(false);

            const [activeCatIndex, setActiveCatIndex] = useState(0);
            const [activePhraseIndex, setActivePhraseIndex] = useState(0);

            // Playback State
            const [status, setStatus] = useState('IDLE');
            const [isPlaying, setIsPlaying] = useState(false);
            const [audioSource, setAudioSource] = useState('');
            const [speed, setSpeed] = useState(1.0);
            const [pauseTime, setPauseTime] = useState(1.5);
            const [loops, setLoops] = useState(3);
            const [loopCount, setLoopCount] = useState(1);

            // Visibility
            const [showCn, setShowCn] = useState(true);
            const [showPy, setShowPy] = useState(true);
            const [showEn, setShowEn] = useState(true);
            
            // New state for Phase 1 features
            const [showHelpModal, setShowHelpModal] = useState(false);

            const timerRef = useRef(null);
            const audioRef = useRef(new Audio());
            const stateRef = useRef({ activePhraseIndex, activeCatIndex, loopCount, loops, pauseTime, isPlaying, speed, data });
            
            // Keyboard shortcut handler
            const handleKeyPress = (e) => {
                // Only handle shortcuts when not in an input field
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                switch(e.key) {
                    case ' ':
                        e.preventDefault();
                        togglePlay();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        nextPhrase();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        prevPhrase();
                        break;
                    case 'r':
                    case 'R':
                        e.preventDefault();
                        restartPhrase();
                        break;
                    case 'b':
                    case 'B':
                        e.preventDefault();
                        toggleBookmarkForCurrentPhrase();
                        break;
                    case '?':
                        e.preventDefault();
                        setShowHelpModal(true);
                        break;
                    case '1':
                    case '2':
                    case '3':
                    case '4':
                    case '5':
                    case '6':
                    case '7':
                    case '8':
                    case '9':
                        e.preventDefault();
                        setLoops(parseInt(e.key));
                        break;
                }
            };

            // Keyboard shortcut effect
            useEffect(() => {
                window.addEventListener('keydown', handleKeyPress);
                return () => {
                    window.removeEventListener('keydown', handleKeyPress);
                };
            }, [activePhraseIndex, activeCatIndex, isPlaying]);

            // Sync Ref
            useEffect(() => {
                stateRef.current = { activePhraseIndex, activeCatIndex, loopCount, loops, pauseTime, isPlaying, speed, data };
                if(audioRef.current) audioRef.current.playbackRate = speed;
            }, [activePhraseIndex, activeCatIndex, loopCount, loops, pauseTime, isPlaying, speed, data]);

            // --- LOAD YAML from uploaded file ---
            const loadYamlFromFile = async (file) => {
                setLoading(true);
                setError(null);
                try {
                    const text = await file.text();
                    const parsed = jsyaml.load(text);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        setData(parsed);
                        setActiveCatIndex(0);
                        setActivePhraseIndex(0);
                        setFileLoaded(true);
                    } else {
                        throw new Error("YAML format is incorrect or empty");
                    }
                } catch (e) {
                    setError(e.message);
                } finally {
                    setLoading(false);
                }
            };

            // Handle new YAML file upload and merge with existing data
            const handleNewYamlFile = async (e) => {
                const file = e.target.files[0];
                if (file && (file.name.endsWith('.yaml') || file.name.endsWith('.yml'))) {
                    setLoading(true);
                    try {
                        const text = await file.text();
                        const parsed = jsyaml.load(text);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            // Merge new data with existing data
                            const mergedData = [...data, ...parsed];
                            setData(mergedData);
                            setActiveCatIndex(mergedData.length - 1); // Switch to the first newly added category
                            setActivePhraseIndex(0);
                        } else {
                            throw new Error("YAML format is incorrect or empty");
                        }
                    } catch (e) {
                        setError(e.message);
                    } finally {
                        setLoading(false);
                    }
                } else {
                    setError("Please select a valid .yaml or .yml file");
                }
            };

            // Handle initial file input
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file && file.name.endsWith('.yaml')) {
                    loadYamlFromFile(file);
                } else {
                    setError("Please select a valid .yaml file");
                }
            };

            // --- HELPERS ---
            const getCurrentPhrase = () => {
                if (!data[stateRef.current.activeCatIndex]) return null;
                const phrase = data[stateRef.current.activeCatIndex].phrases[stateRef.current.activePhraseIndex];
                // Add category to the phrase object for path construction
                if (phrase) {
                    phrase.category = data[stateRef.current.activeCatIndex].category;
                }
                return phrase;
            };

            const getPhrasesInCat = () => {
                if (!data[activeCatIndex]) return [];
                return data[activeCatIndex].phrases;
            };

            // --- AUDIO ENGINE ---
            const playAudio = async (text, onEnd) => {
                const audio = audioRef.current;

                // Get current category to construct proper path
                const currentPhrase = getCurrentPhrase();
                const categoryName = currentPhrase ? currentPhrase.category || 'default' : 'default';
                // Normalize category name to be filesystem-friendly (same as in Python script)
                const safeCategory = categoryName.replace(/[^a-zA-Z0-9 -]/g, '').replace(/\s+/g, '_');

                // 1. Try Local File in category subfolder
                const filename = `audio/${safeCategory}/audio_${md5(text)}.mp3`;

                // Helper to try play
                const tryPlay = (src) => new Promise((resolve, reject) => {
                    audio.src = src;
                    audio.playbackRate = stateRef.current.speed;
                    audio.onended = () => resolve();
                    audio.onerror = (e) => reject(e);
                    audio.play().catch(reject);
                });

                try {
                    setAudioSource('LOCAL');
                    await tryPlay(filename);
                    onEnd();
                } catch (e) {
                    console.log("Local audio failed, trying fallback...", e);
                    setAudioSource('SYSTEM');
                    // Fallback to System TTS
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = "zh-CN";
                    u.rate = stateRef.current.speed;
                    u.onend = onEnd;
                    u.onerror = onEnd; // proceed anyway
                    window.speechSynthesis.speak(u);
                }
            };

            const playSequence = () => {
                setStatus('PLAYING');
                const phrase = getCurrentPhrase();
                if(!phrase) return stop();
                
                // Update category progress when starting to play
                const categoryName = phrase.category || `Category ${activeCatIndex}`;
                ProgressService.updateCategoryProgress(categoryName);
                
                playAudio(phrase.chinese, handleAudioEnd);
            };

            const handleAudioEnd = () => {
                if (!stateRef.current.isPlaying) return;
                setStatus('WAITING');
                timerRef.current = setTimeout(handleGapEnd, stateRef.current.pauseTime * 1000);
            };

            const handleGapEnd = () => {
                if (!stateRef.current.isPlaying) return;
                const { loopCount, loops, activePhraseIndex, activeCatIndex, data } = stateRef.current;
                const currentCat = data[activeCatIndex];

                if (loopCount < loops) {
                    setLoopCount(prev => prev + 1);
                    playSequence();
                } else {
                    // Next Phrase
                    if (activePhraseIndex < currentCat.phrases.length - 1) {
                        nextPhrase();
                    } else {
                        stop(); // End of category
                    }
                }
            };

            const nextPhrase = () => {
                window.speechSynthesis.cancel();
                if(audioRef.current) audioRef.current.pause();
                clearTimeout(timerRef.current);

                const currentCat = data[stateRef.current.activeCatIndex];
                const nextIdx = stateRef.current.activePhraseIndex + 1;

                if (nextIdx < currentCat.phrases.length) {
                    setActivePhraseIndex(nextIdx);
                    setLoopCount(1);
                    stateRef.current.activePhraseIndex = nextIdx;
                    stateRef.current.loopCount = 1;
                    if (stateRef.current.isPlaying) setTimeout(playSequence, 50);
                }
            };

            const prevPhrase = () => {
                const prev = Math.max(0, activePhraseIndex - 1);
                setActivePhraseIndex(prev);
                setLoopCount(1);
                stop();
            };

            const togglePlay = () => {
                if (isPlaying) stop();
                else {
                    setIsPlaying(true);
                    stateRef.current.isPlaying = true;
                    playSequence();
                }
            };

            const stop = () => {
                setIsPlaying(false);
                setStatus('IDLE');
                window.speechSynthesis.cancel();
                if(audioRef.current) audioRef.current.pause();
                clearTimeout(timerRef.current);
            };

            const selectPhrase = (idx) => {
                stop();
                setActivePhraseIndex(idx);
                setLoopCount(1);
            };

            // Restart current phrase function
            const restartPhrase = () => {
                stop();
                setLoopCount(1);
                if (isPlaying) {
                    setIsPlaying(true);
                    stateRef.current.isPlaying = true;
                    playSequence();
                }
            };

            // Toggle bookmark for current phrase
            const toggleBookmarkForCurrentPhrase = () => {
                const phrase = getCurrentPhrase();
                if (phrase) {
                    ProgressService.toggleBookmark(phrase);
                }
            };

            // Scroll Helper
            const listRef = useRef(null);
            useEffect(() => {
                if(listRef.current && listRef.current.children[activePhraseIndex]) {
                    listRef.current.children[activePhraseIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [activePhraseIndex]);


            if (error) return (
                <div className="h-screen flex flex-col items-center justify-center p-8 text-center gap-4">
                    <h2 className="text-xl font-bold text-red-600">Error Loading Data</h2>
                    <p className="max-w-md text-slate-600">{error}</p>
                    <button onClick={() => window.location.reload()} className="px-4 py-2 bg-blue-600 text-white rounded"><Icons.Refresh/> Retry</button>
                </div>
            );

            if (!fileLoaded) return (
                <div className="h-screen flex flex-col items-center justify-center p-8 text-center gap-6">
                    <h1 className="text-2xl font-bold text-slate-800">Mandarin Shadowing App</h1>
                    <div className="max-w-md">
                        <p className="mb-4 text-slate-600">Upload your YAML file to begin</p>
                        <label className="block">
                            <input
                                type="file"
                                accept=".yaml,.yml"
                                onChange={handleFileChange}
                                className="hidden"
                            />
                            <div className="px-6 py-4 bg-blue-600 text-white rounded-lg font-medium cursor-pointer inline-block hover:bg-blue-700 transition-colors">
                                Select YAML File
                            </div>
                        </label>
                        <p className="mt-4 text-sm text-slate-500">The app will use pre-generated audio files from the 'audio' folder</p>
                    </div>
                </div>
            );

            const phrases = getPhrasesInCat();
            const activePhrase = phrases[activePhraseIndex] || {};

            return (
                <div className="flex flex-col h-screen max-w-xl mx-auto bg-white shadow-2xl relative">
                    {/* Header */}
                    <div className="flex flex-col border-b bg-white z-20">
                        <div className="flex justify-between items-center p-4 pb-2">
                            <h1 className="font-bold text-xl">Shadowing App</h1>
                            <div className="flex items-center gap-2">
                                {status === 'PLAYING' && <span className="text-xs text-green-600 font-bold animate-pulse">ACTIVE</span>}
                            </div>
                        </div>
                        {/* Category Selector */}
                        <div className="px-4 pb-4 flex items-center gap-2">
                            <select
                                className="flex-1 p-2 bg-slate-100 rounded-lg font-medium outline-none"
                                value={activeCatIndex}
                                onChange={(e) => {
                                    stop();
                                    setActiveCatIndex(Number(e.target.value));
                                    setActivePhraseIndex(0);
                                }}
                            >
                                {data.map((cat, idx) => {
                                    const progress = ProgressService.getCategoryProgress(cat.category);
                                    const percentage = Math.round((progress.times_practiced / progress.target_practices) * 100);
                                    return (
                                        <option key={idx} value={idx}>
                                            {cat.category} ({cat.phrases.length}) - {progress.times_practiced}/{progress.target_practices} ({percentage}%)
                                        </option>
                                    );
                                })}
                            </select>
                            <label className="cursor-pointer bg-blue-600 text-white p-2 rounded-lg font-medium">
                                +
                                <input
                                    type="file"
                                    accept=".yaml,.yml"
                                    onChange={(e) => handleNewYamlFile(e)}
                                    className="hidden"
                                />
                            </label>
                        </div>
                    </div>

                    {/* Active Card */}
                    <div className="bg-blue-50 p-8 flex flex-col items-center justify-center min-h-[240px] text-center gap-3 relative overflow-hidden">
                         <div className={`transition-all duration-500 ${showCn ? 'opacity-100 blur-0' : 'opacity-0 blur-md'}`}>
                            <h2 className="text-3xl font-bold text-slate-800">{activePhrase.chinese}</h2>
                         </div>
                         <div className={`transition-all duration-500 ${showPy ? 'opacity-100' : 'opacity-0'}`}>
                            <p className="text-xl text-blue-600 font-medium">{activePhrase.pinyin}</p>
                         </div>
                         <div className={`transition-all duration-500 ${showEn ? 'opacity-100' : 'opacity-0'}`}>
                            <p className="text-slate-500">{activePhrase.meaning}</p>
                         </div>
                         
                         <div className="absolute top-4 right-4">
                            {status === 'PLAYING' && <span className="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded-full">LOOP {loopCount}/{loops}</span>}
                            {status === 'WAITING' && <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded-full">SPEAK</span>}
                         </div>
                    </div>

                    {/* Controls */}
                    <div className="p-4 border-b space-y-4 bg-white z-10 shadow-sm">
                        <div className="grid grid-cols-3 gap-4 text-xs font-bold text-slate-500 text-center">
                            <div>
                                <label className="block mb-1">LOOPS: <span className="text-blue-600 text-lg">{loops}</span></label>
                                <div className="flex items-center gap-1">
                                    <button onClick={()=>setLoops(Math.max(1,loops-1))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200">-</button>
                                    <div className="flex-1 h-1 bg-slate-100 rounded overflow-hidden"><div className="bg-blue-500 h-full" style={{width: (loops/10)*100+'%'}}></div></div>
                                    <button onClick={()=>setLoops(Math.min(10,loops+1))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200">+</button>
                                </div>
                            </div>
                            <div>
                                <label className="block mb-1">SPEED: <span className="text-blue-600 text-lg">{speed}x</span></label>
                                <div className="flex items-center gap-1">
                                    <button onClick={()=>setSpeed(Math.max(0.5, +(speed-0.1).toFixed(1)))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200">-</button>
                                    <div className="flex-1 h-1 bg-slate-100 rounded overflow-hidden"><div className="bg-indigo-500 h-full" style={{width: (speed/2)*100+'%'}}></div></div>
                                    <button onClick={()=>setSpeed(Math.min(2.0, +(speed+0.1).toFixed(1)))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200">+</button>
                                </div>
                            </div>
                            <div>
                                <label className="block mb-1">PAUSE: <span className="text-blue-600 text-lg">{pauseTime}s</span></label>
                                <div className="flex items-center gap-1">
                                    <button onClick={()=>setPauseTime(Math.max(0, +(pauseTime-0.5).toFixed(1)))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200">-</button>
                                    <div className="flex-1 h-1 bg-slate-100 rounded overflow-hidden"><div className="bg-teal-500 h-full" style={{width: (pauseTime/10)*100+'%'}}></div></div>
                                    <button onClick={()=>setPauseTime(Math.min(10, +(pauseTime+0.5).toFixed(1)))} className="bg-slate-100 w-6 h-6 rounded hover:bg-slate-200">+</button>
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-center gap-6 py-2 border-t border-slate-100 mt-2">
                             {[{l:'汉',v:showCn,s:setShowCn,c:'blue'},{l:'PY',v:showPy,s:setShowPy,c:'indigo'},{l:'EN',v:showEn,s:setShowEn,c:'teal'}].map((t,i) => (
                                 <button key={i} onClick={()=>t.s(!t.v)} className={`flex items-center gap-2 text-sm font-bold ${t.v?`text-${t.c}-600`:'text-slate-300'}`}>
                                    <div className={`w-4 h-4 rounded-full border-2 ${t.v?`bg-${t.c}-600 border-${t.c}-600`:'border-slate-300'}`}></div>{t.l}
                                 </button>
                             ))}
                        </div>

                        <div className="flex justify-center items-center gap-8 pt-2">
                            <button onClick={prevPhrase} className="text-slate-400 hover:text-slate-600"><Icons.SkipBack /></button>
                            <button onClick={togglePlay} className={`w-14 h-14 rounded-full flex items-center justify-center shadow-lg transform active:scale-95 transition-all ${isPlaying ? 'bg-amber-100 text-amber-600' : 'bg-blue-600 text-white'}`}>
                                {isPlaying ? <Icons.Pause /> : <Icons.Play style={{marginLeft:4}} />}
                            </button>
                            <button onClick={nextPhrase} className="text-slate-400 hover:text-slate-600"><Icons.SkipForward /></button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto playlist-scroll" ref={listRef}>
                        {phrases.map((phrase, idx) => {
                            const isBookmarked = ProgressService.isBookmarked(phrase);
                            return (
                                <div key={idx} onClick={() => selectPhrase(idx)} className={`p-4 border-b flex items-center gap-4 cursor-pointer hover:bg-slate-50 ${idx === activePhraseIndex ? 'bg-blue-50 border-l-4 border-l-blue-500' : 'border-transparent'}`}>
                                    <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${idx === activePhraseIndex ? 'bg-blue-200 text-blue-700' : 'bg-slate-100 text-slate-400'}`}>{idx + 1}</span>
                                    <div className="flex-1">
                                        <p className={`font-medium ${idx === activePhraseIndex ? 'text-blue-900' : 'text-slate-700'}`}>{phrase.chinese}</p>
                                        <p className="text-xs text-slate-400">{phrase.pinyin}</p>
                                    </div>
                                    {isBookmarked && <span className="text-yellow-500">★</span>}
                                    {idx === activePhraseIndex && isPlaying && <Icons.Mic className="w-4 h-4 text-blue-500 animate-bounce" />}
                                </div>
                            );
                        })}
                    </div>

                    {/* Help Modal */}
                    {showHelpModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg max-w-md w-full p-6 relative">
                                <button 
                                    onClick={() => setShowHelpModal(false)} 
                                    className="absolute top-3 right-3 text-gray-500 hover:text-gray-700"
                                >
                                    ✕
                                </button>
                                <h2 className="text-xl font-bold mb-4 text-center">Keyboard Shortcuts</h2>
                                <div className="space-y-2">
                                    <div className="flex justify-between py-1 border-b"><span>Space</span><span>Play/Pause</span></div>
                                    <div className="flex justify-between py-1 border-b"><span>← →</span><span>Previous/Next phrase</span></div>
                                    <div className="flex justify-between py-1 border-b"><span>R</span><span>Restart phrase</span></div>
                                    <div className="flex justify-between py-1 border-b"><span>B</span><span>Bookmark phrase</span></div>
                                    <div className="flex justify-between py-1 border-b"><span>1-9</span><span>Set number of loops</span></div>
                                    <div className="flex justify-between py-1 border-b"><span>S</span><span>Change speed</span></div>
                                    <div className="flex justify-between py-1"><span>?</span><span>Show help</span></div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<Player />);
    </script>
</body>
</html>
