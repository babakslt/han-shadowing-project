    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- USER ACCOUNT & PROGRESS SERVICE (Unchanged) ---
        const ProgressService = {
            init: () => {
                if (!localStorage.getItem('progressData')) localStorage.setItem('progressData', JSON.stringify({}));
                if (!localStorage.getItem('bookmarks')) localStorage.setItem('bookmarks', JSON.stringify([]));
                if (!localStorage.getItem('userProfile')) {
                    localStorage.setItem('userProfile', JSON.stringify({
                        id: 'anonymous_' + Date.now(),
                        name: 'Anonymous User',
                        createdAt: new Date().toISOString(),
                        totalPracticeTime: 0,
                        totalPhrasesPracticed: 0
                    }));
                }
                if (!localStorage.getItem('phraseProgress')) localStorage.setItem('phraseProgress', JSON.stringify({}));
                if (!localStorage.getItem('memoryRepeatCounts')) localStorage.setItem('memoryRepeatCounts', JSON.stringify({}));
                if (!localStorage.getItem('memoryRepeatTarget')) localStorage.setItem('memoryRepeatTarget', JSON.stringify(50));
            },
            getUserProfile: () => JSON.parse(localStorage.getItem('userProfile') || '{}'),
            updateUserProfile: (updates) => {
                const profile = ProgressService.getUserProfile();
                Object.assign(profile, updates);
                localStorage.setItem('userProfile', JSON.stringify(profile));
                return profile;
            },
            getProgressData: () => JSON.parse(localStorage.getItem('progressData') || '{}'),
            getPhraseProgress: () => JSON.parse(localStorage.getItem('phraseProgress') || '{}'),
            getBookmarks: () => JSON.parse(localStorage.getItem('bookmarks') || '[]'),
            saveProgressData: (data) => localStorage.setItem('progressData', JSON.stringify(data)),
            savePhraseProgress: (data) => localStorage.setItem('phraseProgress', JSON.stringify(data)),
            saveBookmarks: (bookmarks) => localStorage.setItem('bookmarks', JSON.stringify(bookmarks)),
            getMemoryRepeatCounts: () => JSON.parse(localStorage.getItem('memoryRepeatCounts') || '{}'),
            saveMemoryRepeatCounts: (data) => localStorage.setItem('memoryRepeatCounts', JSON.stringify(data)),
            getMemoryRepeatTarget: () => parseInt(localStorage.getItem('memoryRepeatTarget') || '50', 10),
            setMemoryRepeatTarget: (target) => localStorage.setItem('memoryRepeatTarget', JSON.stringify(target)),
            
            updateCategoryProgress: (categoryId) => {
                const progressData = ProgressService.getProgressData();
                if (!progressData[categoryId]) {
                    progressData[categoryId] = { times_practiced: 0, last_practiced: null, target_practices: 10 };
                }
                progressData[categoryId].times_practiced += 1;
                progressData[categoryId].last_practiced = new Date().toISOString();
                ProgressService.saveProgressData(progressData);
                
                const profile = ProgressService.getUserProfile();
                profile.totalPhrasesPracticed = (profile.totalPhrasesPracticed || 0) + 1;
                ProgressService.updateUserProfile(profile);
                return progressData[categoryId];
            },

            updatePhraseProgress: (phrase, practiced = true) => {
                const phraseProgress = ProgressService.getPhraseProgress();
                const phraseKey = `${phrase.category}__${phrase.chinese}__${phrase.pinyin}`;
                if (!phraseProgress[phraseKey]) {
                    phraseProgress[phraseKey] = {
                        phrase: { ...phrase },
                        times_practiced: 0, last_practiced: null, first_practiced: null,
                    };
                }
                const now = new Date().toISOString();
                phraseProgress[phraseKey].times_practiced += practiced ? 1 : 0;
                phraseProgress[phraseKey].last_practiced = practiced ? now : phraseProgress[phraseKey].last_practiced;
                if (!phraseProgress[phraseKey].first_practiced && practiced) phraseProgress[phraseKey].first_practiced = now;
                ProgressService.savePhraseProgress(phraseProgress);
            },

            getCategoryProgress: (categoryId) => {
                const progressData = ProgressService.getProgressData();
                return progressData[categoryId] || { times_practiced: 0, last_practiced: null, target_practices: 10 };
            },

            setTargetPractices: (categoryId, target) => {
                const progressData = ProgressService.getProgressData();
                if (!progressData[categoryId]) progressData[categoryId] = { times_practiced: 0, last_practiced: null, target_practices: target };
                else progressData[categoryId].target_practices = target;
                ProgressService.saveProgressData(progressData);
            },

            toggleBookmark: (phrase) => {
                const bookmarks = ProgressService.getBookmarks();
                const phraseKey = `${phrase.category}__${phrase.chinese}__${phrase.pinyin}`;
                const existingIndex = bookmarks.findIndex(b => b.key === phraseKey);
                if (existingIndex >= 0) bookmarks.splice(existingIndex, 1);
                else bookmarks.push({ key: phraseKey, phrase: phrase, timestamp: new Date().toISOString() });
                ProgressService.saveBookmarks(bookmarks);
            },

            isBookmarked: (phrase) => {
                const bookmarks = ProgressService.getBookmarks();
                const phraseKey = `${phrase.category}__${phrase.chinese}__${phrase.pinyin}`;
                return bookmarks.some(b => b.key === phraseKey);
            },
            getMemoryRepeatCount: (phrase) => {
                const counts = ProgressService.getMemoryRepeatCounts();
                const phraseKey = `${phrase.category}__${phrase.chinese}__${phrase.pinyin}`;
                return counts[phraseKey] || 0;
            },
            incrementMemoryRepeat: (phrase) => {
                const counts = ProgressService.getMemoryRepeatCounts();
                const phraseKey = `${phrase.category}__${phrase.chinese}__${phrase.pinyin}`;
                counts[phraseKey] = (counts[phraseKey] || 0) + 1;
                ProgressService.saveMemoryRepeatCounts(counts);
                return counts[phraseKey];
            },

            resetAllProgress: () => {
                localStorage.removeItem('progressData');
                localStorage.removeItem('phraseProgress');
                localStorage.removeItem('bookmarks');
                localStorage.removeItem('userProfile');
                localStorage.removeItem('memoryRepeatCounts');
                localStorage.removeItem('memoryRepeatTarget');
                ProgressService.init();
            }
        };

        ProgressService.init();

        // --- ICONS ---
        const Icons = {

            Mic: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>,
            Refresh: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>,
            Brain: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            Layers: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        };

        // --- THEMES ---
        const THEME_STORAGE_KEY = 'appTheme';
        const THEMES = [
            { id: 'paper', name: 'Paper & Lantern', swatch: '#c25b2d' },
            { id: 'ink', name: 'Calm Ink Wash', swatch: '#2d4f5d' },
            { id: 'studio', name: 'Modern Studio', swatch: '#111827' },
            { id: 'glacier', name: 'Glacier Bright', swatch: '#2b6cb0' },
            { id: 'neon_dusk', name: 'Neon Dusk', swatch: '#200fda' },
            { id: 'crimson_sand', name: 'Crimson Sand', swatch: '#c1121f' },
            { id: 'ember_circuit', name: 'Ember Circuit', swatch: '#a4031f' },
            { id: 'blue_gold', name: 'Blue Gold', swatch: '#ffd500' },
            { id: 'teal_terracotta', name: 'Teal Terracotta', swatch: '#197278' }
        ];

        // --- KEYBOARD SHORTCUTS ---
        const SHORTCUT_STORAGE_KEY = 'keyboardShortcuts';
        const DEFAULT_SHORTCUTS = {
            PLAY_PAUSE: 'SPACE',
            SPEED_UP: 'W',
            SPEED_DOWN: 'S',
            PREV_PHRASE: 'A',
            NEXT_PHRASE: 'D',
            PAUSE_DOWN: 'Q',
            PAUSE_UP: 'E',
            RESTART: 'R',
            BOOKMARK: 'B',
            LOOPS_1: '1',
            LOOPS_2: '2',
            LOOPS_3: '3',
            LOOPS_4: '4',
            LOOPS_5: '5',
            LOOPS_6: '6',
            LOOPS_7: '7',
            LOOPS_8: '8',
            LOOPS_9: '9',
            TOGGLE_CN: 'CTRL+ALT+C',
            TOGGLE_PY: 'CTRL+ALT+Z',
            TOGGLE_EN: 'CTRL+ALT+X',
            HELP: '?',
            CLOSE: 'ESC'
        };
        const SHORTCUT_ACTIONS = [
            { id: 'PLAY_PAUSE', label: 'Play/Pause' },
            { id: 'SPEED_UP', label: 'Speed +' },
            { id: 'SPEED_DOWN', label: 'Speed -' },
            { id: 'PREV_PHRASE', label: 'Prev Phrase' },
            { id: 'NEXT_PHRASE', label: 'Next Phrase' },
            { id: 'PAUSE_DOWN', label: 'Pause -' },
            { id: 'PAUSE_UP', label: 'Pause +' },
            { id: 'RESTART', label: 'Restart Phrase' },
            { id: 'BOOKMARK', label: 'Bookmark' },
            { id: 'TOGGLE_CN', label: 'Toggle Chinese' },
            { id: 'TOGGLE_PY', label: 'Toggle Pinyin' },
            { id: 'TOGGLE_EN', label: 'Toggle English' },
            { id: 'LOOPS_1', label: 'Set Loops 1' },
            { id: 'LOOPS_2', label: 'Set Loops 2' },
            { id: 'LOOPS_3', label: 'Set Loops 3' },
            { id: 'LOOPS_4', label: 'Set Loops 4' },
            { id: 'LOOPS_5', label: 'Set Loops 5' },
            { id: 'LOOPS_6', label: 'Set Loops 6' },
            { id: 'LOOPS_7', label: 'Set Loops 7' },
            { id: 'LOOPS_8', label: 'Set Loops 8' },
            { id: 'LOOPS_9', label: 'Set Loops 9' },
            { id: 'HELP', label: 'Show Shortcuts' },
            { id: 'CLOSE', label: 'Close Modals' }
        ];
        const normalizeCombo = (combo) => (combo || '').replace(/\s+/g, '').toUpperCase();
        const loadShortcuts = () => {
            try {
                const saved = JSON.parse(localStorage.getItem(SHORTCUT_STORAGE_KEY) || '{}');
                const merged = { ...DEFAULT_SHORTCUTS, ...saved };
                Object.keys(merged).forEach((k) => { merged[k] = normalizeCombo(merged[k]); });
                return merged;
            } catch {
                return { ...DEFAULT_SHORTCUTS };
            }
        };
        const getComboFromEvent = (e) => {
            let key = e.key;
            if (!key) return '';
            if (key === ' ') key = 'SPACE';
            if (key === 'Escape') key = 'ESC';
            if (key === 'ArrowLeft') key = 'LEFT';
            if (key === 'ArrowRight') key = 'RIGHT';
            if (key === 'ArrowUp') key = 'UP';
            if (key === 'ArrowDown') key = 'DOWN';
            const isSingleChar = key.length === 1;
            const hasModifier = e.ctrlKey || e.altKey || e.metaKey;
            if (isSingleChar && !hasModifier) {
                return normalizeCombo(key === 'SPACE' ? 'SPACE' : key.toUpperCase());
            }
            const parts = [];
            if (e.ctrlKey) parts.push('CTRL');
            if (e.altKey) parts.push('ALT');
            if (e.metaKey) parts.push('META');
            if (e.shiftKey) parts.push('SHIFT');
            parts.push(key.toUpperCase());
            return normalizeCombo(parts.join('+'));
        };

        // --- PRACTICE MODES TEMPLATES ---
        const SEQUENCE_TEMPLATES = {
            SHADOWING: [
                { type: 'AUDIO', field: 'chinese', lang: 'zh-CN', statusLabel: 'PLAYING', uiStatus: 'PLAYING' },

            ],

                { type: 'PAUSE', statusLabel: 'RECALL', uiStatus: 'WAITING_RECALL' },

        const Player = () => {
            const [data, setData] = useState([]);

            const [audioSource, setAudioSource] = useState('');
            const [speed, setSpeed] = useState(1.0);
            const [pauseTime, setPauseTime] = useState(1.5);
            const [loops, setLoops] = useState(3);
            const [loopCount, setLoopCount] = useState(1);

            // Visibility
            const [showCn, setShowCn] = useState(true);
            const [showPy, setShowPy] = useState(true);
            const [showEn, setShowEn] = useState(true);
            
            // UI toggles
            const [showHelpModal, setShowHelpModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [isEditingShortcuts, setIsEditingShortcuts] = useState(false);
            const [shortcuts, setShortcuts] = useState(() => loadShortcuts());
            const [theme, setTheme] = useState(() => localStorage.getItem(THEME_STORAGE_KEY) || 'paper');
            const [showThemePanel, setShowThemePanel] = useState(false);
            const [showBookmarksOnly, setShowBookmarksOnly] = useState(false);
            const [bookmarkTrigger, setBookmarkTrigger] = useState(0); 
            const [memoryRepeatTarget, setMemoryRepeatTargetState] = useState(() => ProgressService.getMemoryRepeatTarget());
            const themePanelRef = useRef(null);

            const timerRef = useRef(null);
            const audioRef = useRef(new Audio());
            const audioDurationCacheRef = useRef(new Map());
            // Track current step in the template sequence
            const seqStepRef = useRef(0); 
            
            const stateRef = useRef({ activePhraseIndex, activeCatIndex, loopCount, loops, pauseTime, isPlaying, speed, data, practiceMode });

            // Sync Ref
            useEffect(() => {
                stateRef.current = { activePhraseIndex, activeCatIndex, loopCount, loops, pauseTime, isPlaying, speed, data, practiceMode };
                if(audioRef.current) audioRef.current.playbackRate = speed;
            }, [activePhraseIndex, activeCatIndex, loopCount, loops, pauseTime, isPlaying, speed, data, practiceMode]);

            useEffect(() => {
                localStorage.setItem(SHORTCUT_STORAGE_KEY, JSON.stringify(shortcuts));
            }, [shortcuts]);

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem(THEME_STORAGE_KEY, theme);
            }, [theme]);

            useEffect(() => {
                ProgressService.setMemoryRepeatTarget(memoryRepeatTarget);
            }, [memoryRepeatTarget]);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const mode = (params.get('mode') || '').toLowerCase();
                if (mode === 'memory') setPracticeMode('ACTIVE_MEMORY');
                if (mode === 'shadow') setPracticeMode('SHADOWING');
            }, []);

            useEffect(() => {
                if (!showThemePanel) return;
                const handleClickOutside = (e) => {
                    if (themePanelRef.current && !themePanelRef.current.contains(e.target)) {
                        setShowThemePanel(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [showThemePanel]);

            // --- AUDIO ENGINE CORE ---
            const estimateDuration = (text, lang, rate) => {
                const clean = (text || '').trim();
                if (!clean) return 0.8;
                const base = lang === 'zh-CN' ? 0.28 : 0.18;
                const perChar = Math.max(0.12, base / Math.max(rate || 1, 0.5));
                return Math.min(12, Math.max(0.8, clean.length * perChar + 0.6));
            };

            const getAudioCacheKey = (text, lang) => `${lang}__${md5(text || '')}`;

            const cacheDuration = (text, lang, duration) => {
                if (!text || !lang || !duration || !Number.isFinite(duration)) return;
                audioDurationCacheRef.current.set(getAudioCacheKey(text, lang), duration);
            };

            const getCachedDuration = (text, lang) => audioDurationCacheRef.current.get(getAudioCacheKey(text, lang));

            const prefetchLocalDuration = (src, text, lang) => {
                if (!src || getCachedDuration(text, lang)) return;
                const a = new Audio();
                a.src = src;
                a.preload = 'metadata';
                a.onloadedmetadata = () => cacheDuration(text, lang, a.duration);
            };

            const getNextAudioDuration = (template, stepIndex, phrase) => {
                if (!phrase || !template) return 1.0;
                for (let i = stepIndex + 1; i < template.length; i++) {
                    if (template[i].type === 'AUDIO') {
                        const nextText = phrase[template[i].field];
                        const nextLang = template[i].lang;
                        return getCachedDuration(nextText, nextLang) || estimateDuration(nextText, nextLang, stateRef.current.speed);
                    }
                }
                const fallbackText = phrase.chinese || '';
                return getCachedDuration(fallbackText, 'zh-CN') || estimateDuration(fallbackText, 'zh-CN', stateRef.current.speed);
            };

            const playAudio = async (text, lang, onEnd) => {
                const audio = audioRef.current;
                
                // 1. System Fallback (Safe play)
                const playSystemTTS = () => {
                    setAudioSource('SYSTEM');
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    // Find voice if possible
                    const voices = window.speechSynthesis.getVoices();
                    const voice = voices.find(v => v.lang.includes(lang));
                    if (voice) u.voice = voice;
                    
                    u.lang = lang;
                    u.rate = stateRef.current.speed;
                    u.onend = onEnd;
                    u.onerror = (e) => { console.warn("TTS Error", e); onEnd(); };
                    window.speechSynthesis.speak(u);
                };

                // 2. Local Audio Check (Only for Chinese currently)
                if (lang === 'zh-CN') {
                    const currentPhrase = getCurrentPhrase();
                    const categoryName = currentPhrase ? currentPhrase.category || 'default' : 'default';
                    const safeCategory = toSafeCategory(categoryName);
                    const filename = `audio/${safeCategory}/audio_${md5(text)}.mp3`;
                    prefetchLocalDuration(filename, text, lang);

                    const tryPlayLocal = (src) => new Promise((resolve, reject) => {
                        audio.src = src;
                        audio.playbackRate = stateRef.current.speed;
                        audio.onloadedmetadata = () => cacheDuration(text, lang, audio.duration);
                        audio.onended = () => resolve();
                        audio.onerror = (e) => reject(e);
                        audio.play().catch(reject);
                    });

                    try {
                        setAudioSource('LOCAL');
                        await tryPlayLocal(filename);
                        onEnd();
                    } catch (e) {
                        // Local failed, fallback to system
                        playSystemTTS();
                    }
                } else {
                    // For English/Others, go directly to system (unless we generate EN files later)
                    const currentPhrase = getCurrentPhrase();
                    const categoryName = currentPhrase ? currentPhrase.category || 'default' : 'default';
                    const safeCategory = toSafeCategory(categoryName);
                    const filename = `audio/${safeCategory}/audio_${md5(text)}.mp3`;
                    prefetchLocalDuration(filename, text, lang);

                    const tryPlayLocal = (src) => new Promise((resolve, reject) => {
                        audio.src = src;
                        audio.playbackRate = stateRef.current.speed;
                        audio.onloadedmetadata = () => cacheDuration(text, lang, audio.duration);
                        audio.onended = () => resolve();
                        audio.onerror = (e) => reject(e);
                        audio.play().catch(reject);
                    });

                    try {
                        setAudioSource('LOCAL');
                        await tryPlayLocal(filename);
                        onEnd();
                    } catch (e) {
                        // Local failed, fallback to system
                        cacheDuration(text, lang, estimateDuration(text, lang, stateRef.current.speed));
                        playSystemTTS();
                    }
                }
            };

            // --- GENERIC SEQUENCE HANDLER ---
            
            // This function decides what to do next based on the Template and Current Step
            const executeSequenceStep = () => {
                if (!stateRef.current.isPlaying) return;

                const mode = stateRef.current.practiceMode;
                const template = SEQUENCE_TEMPLATES[mode];
                const stepIndex = seqStepRef.current;

                // 1. Check if sequence loop is finished
                if (stepIndex >= template.length) {
                    const { loopCount, loops, activePhraseIndex, activeCatIndex, data } = stateRef.current;
                    const currentCat = data[activeCatIndex];

                    // Logic: Loop or Next Phrase?
                    if (loopCount < loops) {
                        setLoopCount(prev => prev + 1);
                        seqStepRef.current = 0; // Reset step
                        executeSequenceStep(); // Start again
                    } else {
                        // Move to next phrase
                        if (activePhraseIndex < currentCat.phrases.length - 1) {
                            nextPhrase();
                        } else {
                            stop(); // End of list
                        }
                    }
                    return;
                }

                // 2. Execute the current step
                const currentStep = template[stepIndex];
                const phrase = getCurrentPhrase();
                setStatus(currentStep.uiStatus);

                if (currentStep.type === 'AUDIO') {
                    const textToPlay = phrase[currentStep.field]; // e.g. phrase.chinese or phrase.meaning
                    
                    // Update progress if this is the "main" audio (usually chinese)
                    if (currentStep.field === 'chinese') {
                        const categoryName = phrase.category || `Category ${activeCatIndex}`;
                        ProgressService.updateCategoryProgress(categoryName);
                        ProgressService.updatePhraseProgress(phrase);
                        if (stateRef.current.practiceMode === 'ACTIVE_MEMORY') {
                            ProgressService.incrementMemoryRepeat(phrase);
                        }
                    }

                    playAudio(textToPlay, currentStep.lang, () => {
                        if (!stateRef.current.isPlaying) return;
                        seqStepRef.current += 1;
                        executeSequenceStep();
                    });

                } else if (currentStep.type === 'PAUSE') {
                    const dynamicPause = getNextAudioDuration(template, stepIndex, phrase) + stateRef.current.pauseTime;
                    timerRef.current = setTimeout(() => {
                        if (!stateRef.current.isPlaying) return;
                        seqStepRef.current += 1;
                        executeSequenceStep();
                    }, dynamicPause * 1000);
                }
            };

            // Start Playing
            const playSequence = () => {
                const phrase = getCurrentPhrase();
                if(!phrase) return stop();
                
                // Ensure voices are loaded for System TTS fallback
                if (window.speechSynthesis.getVoices().length === 0) {
                    window.speechSynthesis.getVoices();
                }

                seqStepRef.current = 0; // Reset template step
                executeSequenceStep();
            };

            // --- CONTROL FUNCTIONS (Simplified) ---

            const nextPhrase = () => {
                stopInternal();
                if (showBookmarksOnly) {
                    const bookmarks = ProgressService.getBookmarks()
                        .map((b) => ({ ...b.phrase, _key: b.key, _timestamp: b.timestamp }))
                        .map((p) => ({ ...p, _location: findPhraseLocation(p) }))
                        .filter((p) => p._location);
                    const currentIndex = bookmarks.findIndex(
                        (b) =>
                            b._location.catIndex === stateRef.current.activeCatIndex &&
                            b._location.phraseIndex === stateRef.current.activePhraseIndex
                    );
                    const nextItem = bookmarks[currentIndex + 1];
                    if (nextItem && nextItem._location) {
                        setActiveCatIndex(nextItem._location.catIndex);
                        setActivePhraseIndex(nextItem._location.phraseIndex);
                        setLoopCount(1);
                        stateRef.current.activeCatIndex = nextItem._location.catIndex;
                        stateRef.current.activePhraseIndex = nextItem._location.phraseIndex;
                        stateRef.current.loopCount = 1;
                        if (stateRef.current.isPlaying) setTimeout(playSequence, 50);
                    }
                    return;
                }
                const currentCat = data[stateRef.current.activeCatIndex];
                const nextIdx = stateRef.current.activePhraseIndex + 1;
                if (nextIdx < currentCat.phrases.length) {
                    setActivePhraseIndex(nextIdx);
                    setLoopCount(1);
                    stateRef.current.activePhraseIndex = nextIdx;
                    stateRef.current.loopCount = 1;
                    if (stateRef.current.isPlaying) setTimeout(playSequence, 50);
                }
            };

            const prevPhrase = () => {
                if (showBookmarksOnly) {
                    const bookmarks = ProgressService.getBookmarks()
                        .map((b) => ({ ...b.phrase, _key: b.key, _timestamp: b.timestamp }))
                        .map((p) => ({ ...p, _location: findPhraseLocation(p) }))
                        .filter((p) => p._location);
                    const currentIndex = bookmarks.findIndex(
                        (b) =>
                            b._location.catIndex === activeCatIndex &&
                            b._location.phraseIndex === activePhraseIndex
                    );
                    const prevItem = bookmarks[currentIndex - 1];
                    if (prevItem && prevItem._location) {
                        stop();
                        setActiveCatIndex(prevItem._location.catIndex);
                        setActivePhraseIndex(prevItem._location.phraseIndex);
                        setLoopCount(1);
                    }
                    return;
                }
                const prev = Math.max(0, activePhraseIndex - 1);
                setActivePhraseIndex(prev);
                setLoopCount(1);
                stop();
            };

            const restartPhrase = () => {
                stop();
                setLoopCount(1);
                if (isPlaying) {
                    setIsPlaying(true);
                    stateRef.current.isPlaying = true;
                    playSequence();
                }
            };

            const togglePlay = () => {
                if (isPlaying) stop();
                else {
                    setIsPlaying(true);
                    stateRef.current.isPlaying = true;
                    playSequence();
                }
            };

            // Stop wrapper that clears UI state
            const stop = () => {
                setIsPlaying(false);
                setStatus('IDLE');
                stopInternal();
            };

            // Internal stop that doesn't reset "isPlaying" state (used for transitions)
            const stopInternal = () => {
                window.speechSynthesis.cancel();
                if(audioRef.current) audioRef.current.pause();
                clearTimeout(timerRef.current);
            };

            const selectPhrase = (idx) => {
                stop();
                setActivePhraseIndex(idx);
                setLoopCount(1);
            };

            // --- BOILERPLATE (Loaders, Events, etc) ---
            const handleNewYamlFile = async (e) => {
                const file = e.target.files[0];
                if (file && (file.name.endsWith('.yaml') || file.name.endsWith('.yml'))) {
                    setLoading(true);
                    try {
                        const text = await file.text();
                        const parsed = jsyaml.load(text);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            const mergedData = [...data, ...parsed];
                            setData(mergedData);
                            setActiveCatIndex(mergedData.length - 1);
                            setActivePhraseIndex(0);
                            setFileLoaded(true);
                        } else { throw new Error("YAML format incorrect"); }
                    } catch (e) { setError(e.message); } finally { setLoading(false); }
                }
            };
            const handleFileChange = (e) => handleNewYamlFile(e);
            const getCurrentPhrase = () => {
                if (!data[stateRef.current.activeCatIndex]) return null;
                const phrase = data[stateRef.current.activeCatIndex].phrases[stateRef.current.activePhraseIndex];
                if (phrase) phrase.category = data[stateRef.current.activeCatIndex].category;
                return phrase;
            };
            const getPhrasesInCat = () => {
                if (!data[activeCatIndex]) return [];
                const categoryName = data[activeCatIndex].category;
                return data[activeCatIndex].phrases.map((p) => ({ ...p, category: categoryName }));
            };
            const findPhraseLocation = (phrase) => {
                if (!phrase) return null;
                for (let c = 0; c < data.length; c++) {
                    const cat = data[c];
                    const matchCategory = phrase.category ? cat.category === phrase.category : true;
                    if (!matchCategory) continue;
                    const idx = cat.phrases.findIndex((p) => p.chinese === phrase.chinese && p.pinyin === phrase.pinyin);
                    if (idx >= 0) return { catIndex: c, phraseIndex: idx };
                }
                return null;
            };
            const toggleBookmarkForCurrentPhrase = () => {
                const phrase = getCurrentPhrase();
                if (phrase) { ProgressService.toggleBookmark(phrase); setBookmarkTrigger(prev => prev + 1); }
            };

            const handleKeyPress = (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                const combo = getComboFromEvent(e);
                if (!combo) return;
                const action = Object.entries(shortcuts).find(([, value]) => normalizeCombo(value) === combo)?.[0];
                if (!action) return;
                e.preventDefault();
                switch(action) {
                    case 'PLAY_PAUSE': togglePlay(); break;
                    case 'SPEED_UP': document.querySelector('.speed-increase-btn')?.click(); break;
                    case 'SPEED_DOWN': document.querySelector('.speed-decrease-btn')?.click(); break;
                    case 'PREV_PHRASE': prevPhrase(); break;
                    case 'NEXT_PHRASE': nextPhrase(); break;
                    case 'PAUSE_DOWN': document.querySelector('.pause-decrease-btn')?.click(); break;
                    case 'PAUSE_UP': document.querySelector('.pause-increase-btn')?.click(); break;
                    case 'RESTART': restartPhrase(); break;
                    case 'BOOKMARK': toggleBookmarkForCurrentPhrase(); break;
                    case 'TOGGLE_CN': setShowCn(v => !v); break;
                    case 'TOGGLE_PY': setShowPy(v => !v); break;
                    case 'TOGGLE_EN': setShowEn(v => !v); break;
                    case 'LOOPS_1': setLoops(1); break;
                    case 'LOOPS_2': setLoops(2); break;
                    case 'LOOPS_3': setLoops(3); break;
                    case 'LOOPS_4': setLoops(4); break;
                    case 'LOOPS_5': setLoops(5); break;
                    case 'LOOPS_6': setLoops(6); break;
                    case 'LOOPS_7': setLoops(7); break;
                    case 'LOOPS_8': setLoops(8); break;
                    case 'LOOPS_9': setLoops(9); break;
                    case 'HELP': setShowHelpModal(true); break;
                    case 'CLOSE': setShowHelpModal(false); setShowProfileModal(false); break;
                }
            };
            useEffect(() => { window.addEventListener('keydown', handleKeyPress); return () => window.removeEventListener('keydown', handleKeyPress); }, [activePhraseIndex, activeCatIndex, isPlaying, shortcuts]);
            
            // Scroll Ref
            const listRef = useRef(null);
            useEffect(() => {
                if (!listRef.current) return;
                const children = listRef.current.children;
                if (showBookmarksOnly) {
                    const bookmarks = ProgressService.getBookmarks()
                        .map((b) => ({ ...b.phrase, _key: b.key, _timestamp: b.timestamp }))
                        .map((p) => ({ ...p, _location: findPhraseLocation(p) }))
                        .filter((p) => p._location);
                    const currentIndex = bookmarks.findIndex(
                        (b) =>
                            b._location.catIndex === activeCatIndex &&
                            b._location.phraseIndex === activePhraseIndex
                    );
                    if (currentIndex >= 0 && children[currentIndex]) {
                        children[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else if (children[activePhraseIndex]) {
                    children[activePhraseIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [activePhraseIndex, activeCatIndex, showBookmarksOnly]);

            if (error) return <div className="h-screen flex flex-col items-center justify-center p-8 text-center gap-4"><h2 className="text-xl font-bold text-red-600">Error</h2><p>{error}</p><button onClick={() => window.location.reload()} className="px-4 py-2 rounded theme-button-primary">Retry</button></div>;
            if (!fileLoaded) return <div className="h-screen flex flex-col items-center justify-center p-8 text-center gap-6"><h1 className="text-2xl font-bold text-slate-800">Mandarin Shadowing App</h1><div className="max-w-md"><p className="mb-4 text-slate-600">Upload your YAML file to begin</p><label className="block"><input type="file" accept=".yaml,.yml" onChange={handleFileChange} className="hidden" /><div className="px-6 py-4 rounded-lg font-medium cursor-pointer inline-block transition-colors theme-button-primary">Select YAML File</div></label><p className="mt-4 text-sm text-slate-500">The app will use pre-generated audio files from the 'audio' folder</p></div></div>;

            const phrases = getPhrasesInCat();
            const bookmarks = ProgressService.getBookmarks();
            const bookmarkItems = bookmarks
                .map((b) => ({ ...b.phrase, _key: b.key, _timestamp: b.timestamp }))
                .map((p) => ({ ...p, _location: findPhraseLocation(p) }))
                .filter((p) => p._location);
            const activePhrase = phrases[activePhraseIndex] || {};
            const memoryRepeatCount = activePhrase.category ? ProgressService.getMemoryRepeatCount(activePhrase) : 0;
            const memoryRepeatPercent = Math.min(1, memoryRepeatCount / Math.max(memoryRepeatTarget, 1));
            const ringRadius = 26;
            const ringCirc = 2 * Math.PI * ringRadius;
            const ringOffset = ringCirc - ringCirc * memoryRepeatPercent;

            return (
                <div className="h-screen w-full flex flex-col md:p-8"> 
                    <div className="flex-1 flex flex-col md:flex-row theme-shell md:rounded-2xl overflow-hidden max-w-7xl mx-auto w-full">
                        {/* LEFT COLUMN */}
                        <div className="md:w-7/12 lg:w-2/3 flex flex-col h-full border-r theme-border z-10 shadow-lg md:shadow-none">
                            <div className="flex flex-col border-b theme-border z-20">
                                <div className="flex justify-between items-center p-4 pb-2">
                                    <h1 className="font-bold text-xl">Shadowing App</h1>
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={() => { 
                                                stop(); 
                                                setPracticeMode(m => {
                                                    const next = m === 'SHADOWING' ? 'ACTIVE_MEMORY' : 'SHADOWING';
                                                    const params = new URLSearchParams(window.location.search);
                                                    params.set('mode', next === 'ACTIVE_MEMORY' ? 'memory' : 'shadow');
                                                    window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
                                                    return next;
                                                }); 
                                            }}
                                            className={`text-xs px-3 py-1 rounded-full font-bold flex items-center gap-1 border theme-chip`}
                                            title="Switch Practice Mode"
                                        >
                                            {practiceMode === 'ACTIVE_MEMORY' ? <Icons.Brain /> : <Icons.Layers />}
                                            {practiceMode === 'ACTIVE_MEMORY' ? 'Memory' : 'Shadow'}
                                        </button>
                                        <a href="lesson-creator.html" className="text-xs px-3 py-1 rounded-full font-bold theme-chip">Lesson Creator</a>
                                        <button onClick={() => setShowProfileModal(true)} className="text-sm px-3 py-1 rounded-full font-medium theme-chip">Profile</button>
                                    </div>
                                </div>
                            </div>

                            {/* Active Card */}
                            <div className="flex-1 p-6 flex flex-col items-center justify-center text-center gap-4 relative overflow-hidden min-h-[250px] theme-card active-card">
                                {practiceMode === 'ACTIVE_MEMORY' && (
                                    <button
                                        onClick={() => {
                                            const next = prompt('Set memory repeat target (per sentence):', memoryRepeatTarget.toString());
                                            if (next === null) return;
                                            const parsed = parseInt(next, 10);
                                            if (!Number.isFinite(parsed) || parsed <= 0) return;
                                            setMemoryRepeatTargetState(parsed);
                                        }}
                                        className="absolute top-6 left-6 progress-ring rounded-full p-0 flex items-center justify-center"
                                        title="Memory repeat target"
                                    >
                                        <div className="relative w-full h-full flex items-center justify-center">
                                            <svg width="72" height="72">
                                                <circle cx="36" cy="36" r={ringRadius} stroke="var(--border)" strokeWidth="0" fill="none"></circle>
                                                <circle
                                                    cx="36"
                                                    cy="36"
                                                    r={ringRadius}
                                                    stroke="var(--accent)"
                                                    strokeWidth="6"
                                                    fill="none"
                                                    strokeDasharray={ringCirc}
                                                    strokeDashoffset={ringOffset}
                                                    strokeLinecap="round"
                                                ></circle>
                                            </svg>
                                            <div className="absolute inset-0 flex flex-col items-center justify-center text-[10px]">
                                                <div className="font-bold">{Math.round(memoryRepeatPercent * 100)}%</div>
                                                <div className="theme-muted">{memoryRepeatCount}/{memoryRepeatTarget}</div>
                                            </div>
                                        </div>
                                    </button>
                                )}
                                <div className={`transition-all duration-500 ${showCn ? 'opacity-100 blur-0' : 'opacity-0 blur-md'}`}><h2 className="font-bold text-slate-800 leading-tight phrase-text">{activePhrase.chinese}</h2></div>
                                <div className={`transition-all duration-500 ${showPy ? 'opacity-100' : 'opacity-0'}`}><p className="font-medium theme-warm pinyin-text">{activePhrase.pinyin}</p></div>
                                <div className={`transition-all duration-500 ${showEn ? 'opacity-100' : 'opacity-0'}`}><p className="text-slate-500 meaning-text">{activePhrase.meaning}</p></div>
                                <div className="absolute top-4 right-4 z-10 flex flex-col gap-2 items-end">
                                    {status === 'PLAYING' && <span className="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded-full border border-green-200 shadow-sm">LOOP {loopCount}/{loops}</span>}
                                    {status === 'WAITING' && <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded-full border border-amber-200 shadow-sm animate-pulse">SPEAK</span>}
                                    {/* Active Memory Statuses */}
                                    {status === 'PLAYING_EN' && <span className="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded-full border border-indigo-200">LISTEN (EN)</span>}
                                    {status === 'WAITING_RECALL' && <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded-full border border-amber-200 animate-pulse">RECALL?</span>}
                                    {status === 'PLAYING_CH' && <span className="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded-full border border-green-200">CHECK (CH)</span>}
                                    {status === 'WAITING_NEXT' && <span className="bg-purple-100 text-purple-700 text-xs font-bold px-2 py-1 rounded-full border border-purple-200">PAUSE</span>}
                                </div>
                            </div>

                            {/* Controls */}
                            <div className="p-4 border-t border-b md:border-b-0 space-y-4 z-10 shadow-sm theme-card">
                                <div className="grid grid-cols-3 gap-2 md:gap-4 text-xs font-bold text-slate-500 text-center">
                                    <div><label className="block mb-1 theme-warm">LOOPS: <span className="text-lg">{loops}</span></label><div className="flex items-center gap-1 justify-center"><button onClick={()=>setLoops(Math.max(1,loops-1))} className="bg-slate-100 w-8 h-8 rounded hover:bg-slate-200">-</button><button onClick={()=>setLoops(Math.min(10,loops+1))} className="bg-slate-100 w-8 h-8 rounded hover:bg-slate-200">+</button></div></div>
                                    <div><label className="block mb-1 theme-warm">SPEED: <span className="text-lg">{speed}x</span></label><div className="flex items-center gap-1 justify-center"><button onClick={()=>setSpeed(Math.max(0.5, +(speed-0.1).toFixed(1)))} className="bg-slate-100 w-8 h-8 rounded hover:bg-slate-200 speed-decrease-btn">-</button><button onClick={()=>setSpeed(Math.min(2.0, +(speed+0.1).toFixed(1)))} className="bg-slate-100 w-8 h-8 rounded hover:bg-slate-200 speed-increase-btn">+</button></div></div>
                                    <div><label className="block mb-1 theme-warm">PAUSE: <span className="text-lg">{pauseTime}s</span></label><div className="flex items-center gap-1 justify-center"><button onClick={()=>setPauseTime(Math.max(0, +(pauseTime-0.5).toFixed(1)))} className="bg-slate-100 w-8 h-8 rounded hover:bg-slate-200 pause-decrease-btn">-</button><button onClick={()=>setPauseTime(Math.min(10, +(pauseTime+0.5).toFixed(1)))} className="bg-slate-100 w-8 h-8 rounded hover:bg-slate-200 pause-increase-btn">+</button></div></div>
                                </div>
                                <div className="flex justify-center gap-6 py-2 border-t border-slate-100 mt-2">
                                        {[{l:'汉',v:showCn,s:setShowCn,c:'blue'},{l:'PY',v:showPy,s:setShowPy,c:'indigo'},{l:'EN',v:showEn,s:setShowEn,c:'teal'}].map((t,i) => (
                                            <button key={i} onClick={()=>t.s(!t.v)} className={`flex items-center gap-2 text-sm font-bold ${t.v?`text-${t.c}-600`:'text-slate-300'}`}><div className={`w-4 h-4 rounded-full border-2 ${t.v?`bg-${t.c}-600 border-${t.c}-600`:'border-slate-300'}`}></div>{t.l}</button>
                                        ))}
                                </div>
                                <div className="flex justify-center items-center gap-4 pt-2 flex-wrap">
                                    <button onClick={prevPhrase} className="text-slate-400 hover:text-slate-600 p-2 rounded-full hover:bg-slate-100"><Icons.SkipBack /></button>
                                    <button onClick={togglePlay} className={`w-16 h-16 rounded-full flex items-center justify-center shadow-lg transform active:scale-95 transition-all theme-play ${isPlaying ? 'is-playing' : ''}`}>{isPlaying ? <Icons.Pause /> : <Icons.Play style={{marginLeft:4}} />}</button>
                                    <button onClick={nextPhrase} className="text-slate-400 hover:text-slate-600 p-2 rounded-full hover:bg-slate-100"><Icons.SkipForward /></button>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN: Playlist */}
                        <div className="md:w-5/12 lg:w-1/3 flex flex-col h-full overflow-hidden">
                            <div className="p-3 border-b theme-border theme-section-header sticky top-0">
                                <div className="flex items-center justify-between text-xs font-bold uppercase tracking-wider">
                                    <span>{showBookmarksOnly ? 'Starred' : 'Playlist'}</span>
                                    <button onClick={() => setShowBookmarksOnly(v => !v)} className="text-[11px] px-2 py-1 rounded-full font-bold theme-chip">
                                        {showBookmarksOnly ? 'All' : `Starred (${bookmarks.length})`}
                                    </button>
                                </div>
                                <div className="mt-2 flex items-center gap-2">
                                    <select className="flex-1 p-2 rounded-lg font-medium outline-none truncate theme-chip" value={activeCatIndex} onChange={(e) => { stop(); setActiveCatIndex(Number(e.target.value)); setActivePhraseIndex(0); }}>
                                        {data.map((cat, idx) => {
                                            const progress = ProgressService.getCategoryProgress(cat.category);
                                            const percentage = Math.round((progress.times_practiced / progress.target_practices) * 100);
                                            return <option key={idx} value={idx}>{cat.category} ({percentage}%)</option>
                                        })}
                                    </select>
                                    <label className="cursor-pointer p-2 rounded-lg font-medium theme-button-primary">+ <input type="file" accept=".yaml,.yml" onChange={(e) => handleNewYamlFile(e)} className="hidden" /></label>
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto playlist-scroll" ref={listRef}>
                                {(showBookmarksOnly ? bookmarkItems : phrases).map((phrase, idx) => {
                                    const isBookmarked = showBookmarksOnly ? true : ProgressService.isBookmarked(phrase);
                                    const isActive = showBookmarksOnly
                                        ? phrase._location && phrase._location.catIndex === activeCatIndex && phrase._location.phraseIndex === activePhraseIndex
                                        : idx === activePhraseIndex;
                                    return (
                                        <div
                                            key={showBookmarksOnly ? phrase._key : idx}
                                            onClick={() => {
                                                if (showBookmarksOnly && phrase._location) {
                                                    stop();
                                                    setActiveCatIndex(phrase._location.catIndex);
                                                    setActivePhraseIndex(phrase._location.phraseIndex);
                                                    setLoopCount(1);
                                                } else {
                                                    selectPhrase(idx);
                                                }
                                            }}
                                            className={`p-4 border-b flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors ${isActive ? 'bg-blue-50 border-l-4 border-l-blue-500' : 'border-transparent border-l-4'}`}
                                        >
                                            <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${isActive ? 'bg-blue-200 text-blue-700' : 'bg-slate-100 text-slate-400'}`}>{showBookmarksOnly ? '★' : idx + 1}</span>
                                            <div className="flex-1 min-w-0">
                                                <p className={`font-medium truncate ${isActive ? 'text-blue-900' : 'text-slate-700'}`}>{phrase.chinese}</p>
                                                <p className="text-xs text-slate-400 truncate">{phrase.pinyin}</p>
                                            </div>
                                            <button onClick={(e) => { e.stopPropagation(); ProgressService.toggleBookmark(phrase); setBookmarkTrigger(prev => prev + 1); }} className="focus:outline-none p-2 hover:bg-slate-100 rounded-full"><span className={`text-xl leading-none ${isBookmarked ? 'text-yellow-500' : 'text-gray-200'}`}>★</span></button>
                                            {isActive && isPlaying && <Icons.Mic className="w-4 h-4 text-blue-500 animate-bounce flex-shrink-0" />}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* Modals */}
                    {showHelpModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg max-w-lg w-full p-6 relative shadow-xl theme-shell">
                                <button onClick={() => setShowHelpModal(false)} className="absolute top-3 right-3 text-gray-500 hover:text-gray-700">✕</button>
                                <div className="flex items-center justify-between mb-3">
                                    <h2 className="text-xl font-bold">Keyboard Shortcuts</h2>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => setIsEditingShortcuts(v => !v)} className="text-xs px-3 py-1 rounded-full font-bold border border-slate-200 bg-slate-100 hover:bg-slate-200">{isEditingShortcuts ? 'Done' : 'Edit'}</button>
                                        <button onClick={() => setShortcuts({ ...DEFAULT_SHORTCUTS })} className="text-xs px-3 py-1 rounded-full font-bold border border-slate-200 bg-white hover:bg-slate-100">Reset</button>
                                    </div>
                                </div>
                                {isEditingShortcuts && <div className="text-xs text-slate-500 mb-3">Click a shortcut and press new keys. Backspace clears.</div>}
                                <div className="space-y-2 text-sm max-h-80 overflow-y-auto pr-1">
                                    {SHORTCUT_ACTIONS.map((action) => (
                                        <div key={action.id} className="flex justify-between items-center py-1 border-b">
                                            <span>{action.label}</span>
                                            {!isEditingShortcuts ? (
                                                <span className="font-mono text-slate-600">{shortcuts[action.id]}</span>
                                            ) : (
                                                <input
                                                    className="w-36 text-xs font-mono text-right border border-slate-200 rounded px-2 py-1 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-200"
                                                    value={shortcuts[action.id] || ''}
                                                    onChange={() => {}}
                                                    onKeyDown={(e) => {
                                                        e.preventDefault();
                                                        e.stopPropagation();
                                                        if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
                                                        if (e.key === 'Backspace' || e.key === 'Delete') {
                                                            setShortcuts(prev => ({ ...prev, [action.id]: '' }));
                                                            return;
                                                        }
                                                        const combo = getComboFromEvent(e);
                                                        if (!combo) return;
                                                        setShortcuts(prev => ({ ...prev, [action.id]: combo }));
                                                    }}
                                                />
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {showProfileModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg max-w-md w-full p-6 relative shadow-xl">
                                <button onClick={() => setShowProfileModal(false)} className="absolute top-3 right-3 text-gray-500 hover:text-gray-700">✕</button>
                                <h2 className="text-xl font-bold mb-4 text-center">Your Learning Profile</h2>
                                <div className="space-y-4">
                                    <div className="p-3 bg-slate-50 rounded-lg"><div className="font-medium text-slate-700">User:</div><div className="text-lg">{ProgressService.getUserProfile().name || 'Anonymous User'}</div></div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="p-3 bg-blue-50 rounded-lg text-center"><div className="text-2xl font-bold text-blue-600">{ProgressService.getUserProfile().totalPhrasesPracticed || 0}</div><div className="text-sm text-slate-600">Phrases Practiced</div></div>
                                        <div className="p-3 bg-green-50 rounded-lg text-center"><div className="text-2xl font-bold text-green-600">{Object.keys(ProgressService.getPhraseProgress()).length}</div><div className="text-sm text-slate-600">Unique Phrases</div></div>
                                    </div>
                                    <div className="pt-2">
                                        <h3 className="font-bold mb-2">Recent Activity</h3>
                                        <div className="text-sm text-slate-600 max-h-32 overflow-y-auto">
                                            {Object.entries(ProgressService.getProgressData()).sort((a, b) => new Date(b[1].last_practiced) - new Date(a[1].last_practiced)).slice(0, 3).map(([category, data], idx) => (<div key={idx} className="flex justify-between py-1 border-b"><span>{category}</span><span>{data.times_practiced} practices</span></div>))}
                                            {Object.keys(ProgressService.getProgressData()).length === 0 && <div className="text-center py-2 text-slate-500">No practice history yet</div>}
                                        </div>
                                    </div>
                                    <div className="pt-4"><button onClick={() => { if (confirm('Are you sure?')) { ProgressService.resetAllProgress(); setShowProfileModal(false); } }} className="w-full py-2 px-4 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition-colors">Reset All Progress</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-5 right-5 z-40" ref={themePanelRef}>
                        {showThemePanel && (
                            <div className="floating-panel rounded-xl p-3 mb-3 w-48">
                                <div className="text-xs uppercase tracking-wider theme-muted mb-2">Theme</div>
                                <div className="flex flex-col gap-2">
                                    {THEMES.map((t) => (
                                        <button
                                            key={t.id}
                                            onClick={() => { setTheme(t.id); setShowThemePanel(false); }}
                                            className={`text-left text-sm px-3 py-2 rounded-lg border theme-border ${theme === t.id ? 'theme-button-primary' : 'theme-chip'}`}
                                        >
                                            <span className="inline-flex items-center gap-2">
                                                <span className="w-3 h-3 rounded-full border theme-border" style={{ background: t.swatch }}></span>
                                                {t.name}
                                            </span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                        <button onClick={() => setShowThemePanel(v => !v)} className="w-12 h-12 rounded-full floating-btn shadow-lg flex items-center justify-center">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M10.325 4.317a1.5 1.5 0 0 1 3.35 0 1.5 1.5 0 0 0 2.18 1.05 1.5 1.5 0 0 1 2.1 2.1 1.5 1.5 0 0 0 1.05 2.18 1.5 1.5 0 0 1 0 3.35 1.5 1.5 0 0 0-1.05 2.18 1.5 1.5 0 0 1-2.1 2.1 1.5 1.5 0 0 0-2.18 1.05 1.5 1.5 0 0 1-3.35 0 1.5 1.5 0 0 0-2.18-1.05 1.5 1.5 0 0 1-2.1-2.1 1.5 1.5 0 0 0-1.05-2.18 1.5 1.5 0 0 1 0-3.35 1.5 1.5 0 0 0 1.05-2.18 1.5 1.5 0 0 1 2.1-2.1 1.5 1.5 0 0 0 2.18-1.05z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<Player />);
    </script>
</body>
</html>
